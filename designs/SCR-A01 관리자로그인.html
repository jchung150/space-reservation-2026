<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCR-A01 관리자 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    background: oklch(22% 0.025 240);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  /* 배경 격자 패턴 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(oklch(30% 0.03 240 / 60%) 1px, transparent 1px),
      linear-gradient(90deg, oklch(30% 0.03 240 / 60%) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  /* 청록 광원 */
  body::after {
    content: '';
    position: fixed;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 700px; height: 500px;
    background: radial-gradient(ellipse, oklch(55% 0.14 195 / 18%) 0%, transparent 70%);
    pointer-events: none;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-6px); }
    40%      { transform: translateX(6px); }
    60%      { transform: translateX(-4px); }
    80%      { transform: translateX(4px); }
  }
  .card-enter { animation: fadeIn 0.4s ease both; }
  .shake      { animation: shake 0.35s ease; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const C = {
  primary:   'oklch(55% 0.14 195)',
  primaryDk: 'oklch(45% 0.13 195)',
  danger:    'oklch(62% 0.16 25)',
  border:    'oklch(32% 0.03 240)',
  borderLt:  'oklch(38% 0.03 240)',
  cardBg:    'oklch(17% 0.02 240)',
  inputBg:   'oklch(20% 0.025 240)',
  textPri:   '#ffffff',
  textSec:   'oklch(65% 0.02 240)',
  textMuted: 'oklch(45% 0.02 240)',
};

function IconEye({ off }) {
  return off ? (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
      <line x1="1" y1="1" x2="23" y2="23"/>
    </svg>
  ) : (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  );
}

function InputField({ label, type, value, onChange, error, placeholder, rightSlot }) {
  const [focused, setFocused] = useState(false);
  const borderColor = error ? C.danger : focused ? C.primary : C.border;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <label style={{ fontSize: 13, fontWeight: 600, color: C.textSec, letterSpacing: '0.02em' }}>
        {label}
      </label>
      <div style={{
        display: 'flex', alignItems: 'center',
        border: `1.5px solid ${borderColor}`,
        borderRadius: 8, background: C.inputBg,
        transition: '150ms ease',
      }}>
        <input
          type={type}
          value={value}
          onChange={onChange}
          placeholder={placeholder}
          onFocus={e => { setFocused(true); e.target.parentElement.style.borderColor = C.primary; }}
          onBlur={e  => { setFocused(false); e.target.parentElement.style.borderColor = error ? C.danger : C.border; }}
          style={{
            flex: 1, padding: '13px 14px',
            border: 'none', outline: 'none',
            background: 'transparent',
            fontSize: 15, color: C.textPri,
            fontFamily: "'Noto Sans KR', sans-serif",
          }}
        />
        {rightSlot && (
          <div style={{ paddingRight: 12, display: 'flex', alignItems: 'center' }}>
            {rightSlot}
          </div>
        )}
      </div>
      {error && (
        <span style={{ fontSize: 12, color: C.danger, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 4 }}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {error}
        </span>
      )}
    </div>
  );
}

function LoginCard({ showError }) {
  const [id, setId]         = useState(showError ? 'admin01' : '');
  const [pw, setPw]         = useState(showError ? 'wrongpass' : '');
  const [showPw, setShowPw] = useState(false);
  const canSubmit = id.length > 0 && pw.length > 0;

  return (
    <div className="card-enter" style={{
      width: '100%', maxWidth: 420,
      background: C.cardBg,
      border: `1px solid ${C.borderLt}`,
      borderRadius: 16,
      boxShadow: '0 24px 64px oklch(0% 0 0 / 50%), 0 0 0 1px oklch(100% 0 0 / 4%)',
      overflow: 'hidden',
      position: 'relative',
      zIndex: 1,
    }}>
      {/* 상단 포인트 바 */}
      <div style={{ height: 3, background: `linear-gradient(90deg, ${C.primary}, oklch(65% 0.12 210))` }} />

      <div style={{ padding: '36px 36px 32px' }}>

        {/* 로고 + 앱명 */}
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', marginBottom: 32 }}>
          <div style={{
            width: 56, height: 56, borderRadius: 14,
            background: `linear-gradient(135deg, ${C.primary}, oklch(48% 0.15 210))`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            marginBottom: 14,
            boxShadow: `0 8px 24px oklch(55% 0.14 195 / 35%)`,
          }}>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
          <div style={{ fontSize: 20, fontWeight: 700, color: C.textPri, marginBottom: 6 }}>영준피엠씨</div>
          {/* 관리자 포털 배지 */}
          <div style={{
            display: 'inline-flex', alignItems: 'center', gap: 5,
            background: `oklch(55% 0.14 195 / 15%)`,
            border: `1px solid oklch(55% 0.14 195 / 35%)`,
            borderRadius: 20, padding: '4px 12px',
          }}>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke={C.primary} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span style={{ fontSize: 12, fontWeight: 700, color: C.primary, letterSpacing: '0.04em' }}>
              관리자 포털
            </span>
          </div>
        </div>

        {/* 오류 배너 */}
        {showError && (
          <div className="shake" style={{
            display: 'flex', alignItems: 'center', gap: 8,
            background: 'oklch(20% 0.04 25)',
            border: `1px solid oklch(35% 0.08 25)`,
            borderRadius: 8, padding: '10px 14px', marginBottom: 20,
          }}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={C.danger} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span style={{ fontSize: 13, color: C.danger, fontWeight: 600 }}>
              아이디 또는 비밀번호가 올바르지 않습니다.
            </span>
          </div>
        )}

        {/* 입력 폼 */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14, marginBottom: 24 }}>
          <InputField
            label="아이디"
            type="text"
            value={id}
            onChange={e => setId(e.target.value)}
            placeholder="관리자 아이디"
            error={showError ? '아이디를 확인해주세요' : null}
          />
          <InputField
            label="비밀번호"
            type={showPw ? 'text' : 'password'}
            value={pw}
            onChange={e => setPw(e.target.value)}
            placeholder="비밀번호"
            error={showError ? '비밀번호를 확인해주세요' : null}
            rightSlot={
              <button
                onClick={() => setShowPw(v => !v)}
                style={{ background: 'none', border: 'none', cursor: 'pointer', color: C.textMuted, padding: 0, display: 'flex' }}
              >
                <IconEye off={!showPw} />
              </button>
            }
          />
        </div>

        {/* 로그인 버튼 */}
        <button style={{
          width: '100%', padding: '14px',
          borderRadius: 8, border: 'none',
          background: canSubmit
            ? `linear-gradient(135deg, ${C.primary}, oklch(48% 0.15 210))`
            : 'oklch(28% 0.02 240)',
          color: canSubmit ? '#fff' : C.textMuted,
          fontSize: 15, fontWeight: 700,
          cursor: canSubmit ? 'pointer' : 'not-allowed',
          fontFamily: "'Noto Sans KR', sans-serif",
          transition: '150ms ease',
          letterSpacing: '0.02em',
          boxShadow: canSubmit ? `0 4px 16px oklch(55% 0.14 195 / 30%)` : 'none',
          marginBottom: 24,
        }}>
          로그인
        </button>

        {/* 하단 구분선 + 안내 */}
        <div style={{
          borderTop: `1px solid ${C.border}`,
          paddingTop: 20, textAlign: 'center',
        }}>
          <span style={{ fontSize: 12, color: C.textMuted, lineHeight: 1.7 }}>
            직원 로그인은 별도 주소를 이용해주세요.
          </span>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('normal'); // 'normal' | 'error'
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', width: '100%', gap: 24 }}>
      {/* 탭 전환 (데모용) */}
      <div style={{
        display: 'flex', gap: 0,
        background: 'oklch(18% 0.02 240)',
        border: '1px solid oklch(32% 0.03 240)',
        borderRadius: 8, padding: 3, zIndex: 1,
      }}>
        {[['normal', '기본 상태'], ['error', '오류 상태']].map(([key, label]) => (
          <button key={key} onClick={() => setTab(key)} style={{
            padding: '7px 20px', borderRadius: 6, border: 'none',
            background: tab === key ? 'oklch(55% 0.14 195)' : 'transparent',
            color: tab === key ? '#fff' : 'oklch(55% 0.02 240)',
            fontSize: 13, fontWeight: 600, cursor: 'pointer',
            fontFamily: "'Noto Sans KR', sans-serif",
            transition: '150ms ease',
          }}>{label}</button>
        ))}
      </div>
      <LoginCard showError={tab === 'error'} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

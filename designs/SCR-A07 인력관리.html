<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCR-A07 인력 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { font-family: 'Noto Sans KR', sans-serif; background: oklch(95% 0.005 220); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: oklch(80% 0.01 240); border-radius: 3px; }
  select { appearance: none; -webkit-appearance: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const C = {
  primary:   'oklch(55% 0.14 195)',
  primaryBg: 'oklch(93% 0.06 195)',
  danger:    'oklch(62% 0.16 25)',
  dangerBg:  'oklch(95% 0.04 25)',
  success:   'oklch(62% 0.15 160)',
  successBg: 'oklch(93% 0.05 160)',
  warning:   'oklch(65% 0.16 65)',
  border:    'oklch(88% 0.008 240)',
  cardBg:    '#ffffff',
  pageBg:    'oklch(95% 0.005 220)',
  sidebar:   'oklch(16% 0.02 250)',
  textPri:   'oklch(18% 0.01 260)',
  textSec:   'oklch(50% 0.01 260)',
  textMuted: 'oklch(65% 0.01 260)',
  inactive:  'oklch(70% 0.005 240)',
  inactiveBg:'oklch(96% 0.003 240)',
};

const DEPT_COLOR = { 보안:'oklch(65% 0.16 65)', 청소:'oklch(62% 0.15 160)', 시설:'oklch(55% 0.14 195)' };

const NAV_ITEMS = [
  { key:'dashboard', label:'대시보드' },
  { key:'tasks',     label:'업무 관리' },
  { key:'reports',   label:'완료 보고 검토', badge: 7 },
  { key:'staff',     label:'인력 관리' },
  { key:'archive',   label:'아카이브' },
];
const NAV_ICONS = {
  dashboard: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
  tasks:     <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/></svg>,
  reports:   <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>,
  staff:     <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
  archive:   <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/></svg>,
};

const STAFF = [
  { id:1, name:'김보안', dept:'보안', phone:'010-1234-5678', active:true,  assigned:8, rate:75 },
  { id:2, name:'이보안', dept:'보안', phone:'010-2345-6789', active:true,  assigned:5, rate:60 },
  { id:3, name:'이청소', dept:'청소', phone:'010-3456-7890', active:true,  assigned:6, rate:83 },
  { id:4, name:'최청소', dept:'청소', phone:'010-4567-8901', active:false, assigned:0, rate:null },
  { id:5, name:'박유지', dept:'시설', phone:'010-5678-9012', active:true,  assigned:7, rate:71 },
];

const ADMINS = [
  { id:1, name:'박관리', role:'최고 관리자', phone:'010-1111-2222', active:true },
  { id:2, name:'이부장', role:'관리자',     phone:'010-3333-4444', active:true },
];

// ── 사이드바 ──────────────────────────────────────────
function Sidebar({ active }) {
  return (
    <div style={{ width:220, flexShrink:0, background:C.sidebar, display:'flex', flexDirection:'column', height:'100vh', position:'sticky', top:0 }}>
      <div style={{ padding:'24px 20px 20px', borderBottom:'1px solid oklch(24% 0.02 250)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div style={{ width:32, height:32, borderRadius:8, background:C.primary, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
          <div>
            <div style={{ fontSize:14, fontWeight:700, color:'#fff' }}>영준피엠씨</div>
            <div style={{ fontSize:10, color:'oklch(50% 0.02 250)', marginTop:1 }}>관리자 포털</div>
          </div>
        </div>
      </div>
      <nav style={{ flex:1, padding:'12px 10px' }}>
        {NAV_ITEMS.map(item => {
          const isActive = item.key === active;
          return (
            <button key={item.key} style={{
              width:'100%', display:'flex', alignItems:'center', gap:10,
              padding:'10px 12px', borderRadius:8, border:'none', cursor:'pointer',
              background: isActive ? C.primary : 'transparent',
              color: isActive ? '#fff' : 'oklch(60% 0.02 250)',
              fontSize:13, fontWeight: isActive ? 600 : 400,
              fontFamily:"'Noto Sans KR', sans-serif",
              marginBottom:2, textAlign:'left', transition:'150ms ease',
            }}>
              {NAV_ICONS[item.key]}{item.label}
              {item.badge && <span style={{ marginLeft:'auto', fontSize:10, fontWeight:700, background: isActive ? 'rgba(255,255,255,0.25)' : C.danger, color:'#fff', borderRadius:10, padding:'1px 6px' }}>{item.badge}</span>}
            </button>
          );
        })}
      </nav>
      <div style={{ padding:'16px 16px 20px', borderTop:'1px solid oklch(24% 0.02 250)', display:'flex', alignItems:'center', gap:10 }}>
        <div style={{ width:32, height:32, borderRadius:'50%', background:'oklch(30% 0.03 250)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:700, color:'oklch(70% 0.02 250)', flexShrink:0 }}>박</div>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:13, fontWeight:600, color:'#fff' }}>박관리</div>
          <div style={{ fontSize:11, color:'oklch(45% 0.02 250)' }}>관리자</div>
        </div>
      </div>
    </div>
  );
}

// ── 드롭다운 ──────────────────────────────────────────
function FilterSelect({ value, onChange, options, minWidth = 120 }) {
  return (
    <div style={{ position:'relative', display:'inline-flex' }}>
      <select value={value} onChange={e => onChange(e.target.value)} style={{
        padding:'8px 32px 8px 12px', borderRadius:8,
        border:`1.5px solid ${C.border}`,
        background:C.cardBg, color:C.textPri,
        fontSize:13, fontWeight:600, cursor:'pointer',
        fontFamily:"'Noto Sans KR', sans-serif",
        minWidth, outline:'none',
      }}>
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={C.textMuted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
        style={{ position:'absolute', right:10, top:'50%', transform:'translateY(-50%)', pointerEvents:'none' }}>
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </div>
  );
}

// ── 직원 추가/수정 모달 ──────────────────────────────
function StaffModal({ mode, initial, onClose, onSave }) {
  const [name, setName]     = useState(initial?.name || '');
  const [dept, setDept]     = useState(initial?.dept || '보안');
  const [phone, setPhone]   = useState(initial?.phone || '');
  const [loginId, setLogin] = useState(initial?.loginId || '');
  const [pw, setPw]         = useState('');
  const [errors, setErrors] = useState({});

  const isEdit = mode === 'edit';

  function handleSave() {
    const e = {};
    if (!name.trim())    e.name    = '이름을 입력해주세요';
    if (!loginId.trim()) e.loginId = '아이디를 입력해주세요';
    if (!isEdit && !pw)  e.pw      = '임시 비밀번호를 입력해주세요';
    setErrors(e);
    if (Object.keys(e).length === 0) onSave({ name, dept, phone, loginId });
  }

  const inputStyle = err => ({
    width:'100%', padding:'10px 12px', borderRadius:8,
    border:`1.5px solid ${err ? C.danger : C.border}`,
    background:C.pageBg, fontSize:14, color:C.textPri,
    outline:'none', fontFamily:"'Noto Sans KR', sans-serif",
    transition:'150ms ease',
  });
  const Lbl = ({ children, required }) => (
    <div style={{ fontSize:13, fontWeight:600, color:C.textPri, marginBottom:6, display:'flex', alignItems:'center', gap:4 }}>
      {children}
      {required && <span style={{ color:C.danger, fontSize:13 }}>*</span>}
    </div>
  );
  const Err = ({ msg }) => msg ? (
    <div style={{ fontSize:12, color:C.danger, fontWeight:600, marginTop:5, display:'flex', alignItems:'center', gap:4 }}>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {msg}
    </div>
  ) : null;

  return (
    <div onClick={onClose} style={{
      position:'fixed', inset:0, background:'oklch(0% 0 0 / 45%)',
      display:'flex', alignItems:'center', justifyContent:'center',
      zIndex:100, animation:'fadeIn 0.2s ease',
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        width:480, maxHeight:'90vh', overflowY:'auto',
        background:C.cardBg, borderRadius:14,
        boxShadow:'0 20px 60px oklch(0% 0 0 / 25%)',
        animation:'scaleIn 0.25s cubic-bezier(0.34,1.2,0.64,1)',
      }}>
        {/* 헤더 */}
        <div style={{ padding:'18px 22px', borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div>
            <h2 style={{ fontSize:17, fontWeight:700, color:C.textPri }}>{isEdit ? '직원 정보 수정' : '새 직원 추가'}</h2>
            <div style={{ fontSize:12, color:C.textMuted, marginTop:2 }}>{isEdit ? '직원 정보를 수정합니다' : '신규 직원을 등록하고 로그인 계정을 발급합니다'}</div>
          </div>
          <button onClick={onClose} style={{ width:32, height:32, borderRadius:8, border:'none', background:'transparent', cursor:'pointer', color:C.textMuted, display:'flex', alignItems:'center', justifyContent:'center' }}
            onMouseEnter={e => e.currentTarget.style.background = C.pageBg}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        {/* 폼 */}
        <div style={{ padding:'22px' }}>
          <div style={{ marginBottom:16 }}>
            <Lbl required>이름</Lbl>
            <input value={name} onChange={e => setName(e.target.value)} placeholder="홍길동" style={inputStyle(errors.name)} />
            <Err msg={errors.name} />
          </div>

          <div style={{ marginBottom:16 }}>
            <Lbl required>직군</Lbl>
            <div style={{ display:'flex', gap:0, background:C.pageBg, border:`1px solid ${C.border}`, borderRadius:8, padding:3 }}>
              {['보안','청소','시설유지보수'].map(d => (
                <button key={d} onClick={() => setDept(d === '시설유지보수' ? '시설' : d)} style={{
                  flex:1, padding:'8px 12px', borderRadius:6, border:'none', cursor:'pointer',
                  fontSize:13, fontWeight:600,
                  background: (dept === d || (dept === '시설' && d === '시설유지보수')) ? C.primary : 'transparent',
                  color: (dept === d || (dept === '시설' && d === '시설유지보수')) ? '#fff' : C.textSec,
                  fontFamily:"'Noto Sans KR', sans-serif", transition:'150ms ease',
                }}>{d}</button>
              ))}
            </div>
          </div>

          <div style={{ marginBottom:16 }}>
            <Lbl>연락처</Lbl>
            <input value={phone} onChange={e => setPhone(e.target.value)} placeholder="010-0000-0000" style={inputStyle()} />
          </div>

          <div style={{ height:1, background:C.border, margin:'20px 0' }} />

          <div style={{ marginBottom:16 }}>
            <Lbl required>아이디 (로그인용)</Lbl>
            <input value={loginId} onChange={e => setLogin(e.target.value)} placeholder="영문/숫자 4자 이상" style={inputStyle(errors.loginId)} />
            <Err msg={errors.loginId} />
          </div>

          {!isEdit && (
            <div>
              <Lbl required>임시 비밀번호</Lbl>
              <input type="text" value={pw} onChange={e => setPw(e.target.value)} placeholder="초기 발급용 비밀번호" style={inputStyle(errors.pw)} />
              <Err msg={errors.pw} />
              <div style={{ fontSize:11, color:C.textMuted, marginTop:6, display:'flex', alignItems:'center', gap:4 }}>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                직원이 첫 로그인 시 비밀번호 변경을 안내합니다
              </div>
            </div>
          )}
        </div>

        {/* 푸터 */}
        <div style={{ padding:'14px 22px', borderTop:`1px solid ${C.border}`, background:C.pageBg, borderRadius:'0 0 14px 14px', display:'flex', gap:10, justifyContent:'flex-end' }}>
          <button onClick={onClose} style={{
            padding:'10px 22px', borderRadius:8,
            border:`1.5px solid ${C.border}`, background:'#fff',
            fontSize:13, fontWeight:600, color:C.textSec, cursor:'pointer',
            fontFamily:"'Noto Sans KR', sans-serif", transition:'150ms ease',
          }}>취소</button>
          <button onClick={handleSave} style={{
            padding:'10px 26px', borderRadius:8, border:'none',
            background:C.primary, color:'#fff',
            fontSize:13, fontWeight:700, cursor:'pointer',
            fontFamily:"'Noto Sans KR', sans-serif",
            boxShadow:`0 2px 8px oklch(55% 0.14 195 / 30%)`,
            transition:'150ms ease',
          }}>{isEdit ? '수정 저장' : '직원 추가'}</button>
        </div>
      </div>
    </div>
  );
}

// ── 메인 ──────────────────────────────────────────────
function StaffPage() {
  const [tab, setTab] = useState('staff');
  const [search, setSearch]         = useState('');
  const [deptFilter, setDeptFilter] = useState('전체');
  const [statFilter, setStatFilter] = useState('전체');
  const [modal, setModal]           = useState(null); // {mode:'add'|'edit', initial?}

  const deptMap = { 보안:'보안', 청소:'청소', '시설유지보수':'시설' };
  const filtered = STAFF.filter(s => {
    const matchSearch = !search || s.name.includes(search);
    const matchDept = deptFilter === '전체' || s.dept === deptMap[deptFilter];
    const matchStat = statFilter === '전체'
      || (statFilter === '활성'  && s.active)
      || (statFilter === '비활성' && !s.active);
    return matchSearch && matchDept && matchStat;
  });

  return (
    <div style={{ flex:1, overflowY:'auto', padding:'28px 32px', minWidth:0 }}>
      {/* 헤더 */}
      <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:24 }}>
        <div>
          <h1 style={{ fontSize:22, fontWeight:700, color:C.textPri }}>인력 관리</h1>
          <div style={{ fontSize:13, color:C.textMuted, marginTop:3 }}>직원 및 관리자 계정을 관리하세요</div>
        </div>
        <div style={{ display:'flex', gap:10 }}>
          <button onClick={() => setModal({ mode:'addAdmin' })} style={{
            display:'flex', alignItems:'center', gap:6,
            padding:'10px 16px', borderRadius:8,
            border:`1.5px solid ${C.border}`, background:'#fff',
            fontSize:13, fontWeight:600, color:C.textSec, cursor:'pointer',
            fontFamily:"'Noto Sans KR', sans-serif", transition:'150ms ease',
          }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            관리자 추가
          </button>
          <button onClick={() => setModal({ mode:'add' })} style={{
            display:'flex', alignItems:'center', gap:6,
            padding:'10px 18px', borderRadius:8, border:'none',
            background:C.primary, color:'#fff',
            fontSize:14, fontWeight:700, cursor:'pointer',
            fontFamily:"'Noto Sans KR', sans-serif",
            boxShadow:`0 2px 8px oklch(55% 0.14 195 / 30%)`,
            transition:'150ms ease',
          }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            새 직원 추가
          </button>
        </div>
      </div>

      {/* 탭 */}
      <div style={{ display:'flex', gap:0, borderBottom:`1px solid ${C.border}`, marginBottom:20 }}>
        {[
          { key:'staff', label:'현장 직원', count:STAFF.length },
          { key:'admin', label:'관리자',   count:ADMINS.length },
        ].map(t => (
          <button key={t.key} onClick={() => setTab(t.key)} style={{
            padding:'10px 20px', border:'none', background:'none', cursor:'pointer',
            fontSize:14, fontWeight: tab===t.key ? 700 : 400,
            color: tab===t.key ? C.primary : C.textSec,
            borderBottom: tab===t.key ? `2px solid ${C.primary}` : '2px solid transparent',
            fontFamily:"'Noto Sans KR', sans-serif", transition:'150ms ease',
            display:'flex', alignItems:'center', gap:6, marginBottom:-1,
          }}>
            {t.label}
            <span style={{
              fontSize:11, fontWeight:700, borderRadius:10, padding:'1px 7px',
              background: tab===t.key ? C.primary : C.border,
              color: tab===t.key ? '#fff' : C.textSec,
            }}>{t.count}</span>
          </button>
        ))}
      </div>

      {tab === 'staff' && (
        <>
          {/* 필터 바 */}
          <div style={{ background:C.cardBg, borderRadius:12, border:`1px solid ${C.border}`, padding:'14px 16px', marginBottom:16, display:'flex', flexWrap:'wrap', gap:10, alignItems:'center' }}>
            <div style={{ position:'relative', flex:'1 1 200px', minWidth:200 }}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={C.textMuted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
                style={{ position:'absolute', left:11, top:'50%', transform:'translateY(-50%)', pointerEvents:'none' }}>
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input
                type="text" value={search} onChange={e => setSearch(e.target.value)}
                placeholder="이름으로 검색"
                style={{
                  width:'100%', padding:'8px 12px 8px 34px', borderRadius:8,
                  border:`1.5px solid ${C.border}`, fontSize:13, color:C.textPri,
                  outline:'none', fontFamily:"'Noto Sans KR', sans-serif",
                  background:C.pageBg, transition:'150ms ease',
                }}
              />
            </div>
            <FilterSelect value={deptFilter} onChange={setDeptFilter} options={['전체','보안','청소','시설유지보수']} minWidth={130} />
            <FilterSelect value={statFilter} onChange={setStatFilter} options={['전체','활성','비활성']} minWidth={110} />
          </div>

          {/* 테이블 */}
          <div style={{ background:C.cardBg, borderRadius:12, border:`1px solid ${C.border}`, overflow:'hidden' }}>
            <table style={{ width:'100%', borderCollapse:'collapse' }}>
              <thead>
                <tr style={{ background:C.pageBg, borderBottom:`1px solid ${C.border}` }}>
                  {['이름','직군','연락처','계정 상태','배정 업무','완료율','액션'].map(h => (
                    <th key={h} style={{ padding:'11px 16px', fontSize:11, fontWeight:700, color:C.textMuted, textAlign:'left', letterSpacing:'0.04em', whiteSpace:'nowrap' }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.map(s => {
                  const dc = DEPT_COLOR[s.dept];
                  return (
                    <tr key={s.id} style={{
                      borderTop:`1px solid ${C.border}`,
                      background: s.active ? 'transparent' : C.inactiveBg,
                      opacity: s.active ? 1 : 0.65,
                      transition:'120ms',
                    }}
                    onMouseEnter={e => { if (s.active) e.currentTarget.style.background = C.pageBg; }}
                    onMouseLeave={e => { if (s.active) e.currentTarget.style.background = 'transparent'; }}>
                      <td style={{ padding:'12px 16px' }}>
                        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                          <div style={{
                            width:32, height:32, borderRadius:'50%',
                            background: s.active ? `${dc}18` : C.inactiveBg,
                            border:`1.5px solid ${s.active ? dc : C.border}`,
                            display:'flex', alignItems:'center', justifyContent:'center',
                            fontSize:13, fontWeight:700,
                            color: s.active ? dc : C.textMuted,
                          }}>{s.name[0]}</div>
                          <span style={{ fontSize:14, fontWeight:600, color: s.active ? C.textPri : C.textMuted }}>{s.name}</span>
                        </div>
                      </td>
                      <td style={{ padding:'12px 16px' }}>
                        <span style={{
                          display:'inline-flex', alignItems:'center', gap:5,
                          fontSize:11, fontWeight:600,
                          color: s.active ? dc : C.textMuted,
                          background: s.active ? `${dc}18` : C.inactiveBg,
                          borderRadius:6, padding:'3px 8px',
                        }}>
                          <span style={{ width:5, height:5, borderRadius:'50%', background: s.active ? dc : C.textMuted }} />
                          {s.dept}
                        </span>
                      </td>
                      <td style={{ padding:'12px 16px', fontSize:13, color: s.active ? C.textSec : C.textMuted }}>{s.phone}</td>
                      <td style={{ padding:'12px 16px' }}>
                        <span style={{
                          fontSize:11, fontWeight:600, borderRadius:6, padding:'3px 8px',
                          color: s.active ? C.success : C.textMuted,
                          background: s.active ? C.successBg : C.inactiveBg,
                          border: s.active ? 'none' : `1px solid ${C.border}`,
                        }}>
                          {s.active ? '● 활성' : '○ 비활성'}
                        </span>
                      </td>
                      <td style={{ padding:'12px 16px', fontSize:13, color: s.active ? C.textPri : C.textMuted, fontWeight:600 }}>
                        {s.assigned}건
                      </td>
                      <td style={{ padding:'12px 16px' }}>
                        {s.rate !== null ? (
                          <div style={{ display:'flex', alignItems:'center', gap:8, minWidth:120 }}>
                            <div style={{ flex:1, height:6, background:C.pageBg, borderRadius:3, overflow:'hidden' }}>
                              <div style={{ width:`${s.rate}%`, height:'100%', background: s.rate >= 80 ? C.success : s.rate >= 60 ? C.primary : C.warning, borderRadius:3 }} />
                            </div>
                            <span style={{ fontSize:12, fontWeight:700, color:C.textPri, width:32, textAlign:'right' }}>{s.rate}%</span>
                          </div>
                        ) : (
                          <span style={{ fontSize:13, color:C.textMuted }}>—</span>
                        )}
                      </td>
                      <td style={{ padding:'12px 16px' }}>
                        <div style={{ display:'flex', gap:6 }}>
                          {s.active ? (
                            <>
                              <button onClick={() => setModal({ mode:'edit', initial:s })}
                                style={{ padding:'6px 12px', borderRadius:7, border:`1px solid ${C.border}`, background:'#fff', cursor:'pointer', fontSize:12, fontWeight:600, color:C.textSec, fontFamily:"'Noto Sans KR', sans-serif", transition:'150ms ease' }}
                                onMouseEnter={e => { e.currentTarget.style.background = C.primaryBg; e.currentTarget.style.borderColor = C.primary; e.currentTarget.style.color = C.primary; }}
                                onMouseLeave={e => { e.currentTarget.style.background = '#fff'; e.currentTarget.style.borderColor = C.border; e.currentTarget.style.color = C.textSec; }}>
                                수정
                              </button>
                              <button style={{ padding:'6px 12px', borderRadius:7, border:`1px solid ${C.border}`, background:'#fff', cursor:'pointer', fontSize:12, fontWeight:600, color:C.textSec, fontFamily:"'Noto Sans KR', sans-serif", transition:'150ms ease' }}
                                onMouseEnter={e => { e.currentTarget.style.background = C.dangerBg; e.currentTarget.style.borderColor = C.danger; e.currentTarget.style.color = C.danger; }}
                                onMouseLeave={e => { e.currentTarget.style.background = '#fff'; e.currentTarget.style.borderColor = C.border; e.currentTarget.style.color = C.textSec; }}>
                                비활성화
                              </button>
                            </>
                          ) : (
                            <button style={{ padding:'6px 14px', borderRadius:7, border:`1.5px solid ${C.success}`, background:'#fff', cursor:'pointer', fontSize:12, fontWeight:700, color:C.success, fontFamily:"'Noto Sans KR', sans-serif", transition:'150ms ease' }}
                              onMouseEnter={e => { e.currentTarget.style.background = C.successBg; }}
                              onMouseLeave={e => { e.currentTarget.style.background = '#fff'; }}>
                              활성화
                            </button>
                          )}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </>
      )}

      {tab === 'admin' && (
        <div style={{ background:C.cardBg, borderRadius:12, border:`1px solid ${C.border}`, overflow:'hidden' }}>
          <table style={{ width:'100%', borderCollapse:'collapse' }}>
            <thead>
              <tr style={{ background:C.pageBg, borderBottom:`1px solid ${C.border}` }}>
                {['이름','권한','연락처','계정 상태','액션'].map(h => (
                  <th key={h} style={{ padding:'11px 16px', fontSize:11, fontWeight:700, color:C.textMuted, textAlign:'left', letterSpacing:'0.04em' }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {ADMINS.map(a => (
                <tr key={a.id} style={{ borderTop:`1px solid ${C.border}` }}>
                  <td style={{ padding:'12px 16px' }}>
                    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                      <div style={{ width:32, height:32, borderRadius:'50%', background:'oklch(93% 0.06 195)', border:`1.5px solid ${C.primary}`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:700, color:C.primary }}>{a.name[0]}</div>
                      <span style={{ fontSize:14, fontWeight:600, color:C.textPri }}>{a.name}</span>
                    </div>
                  </td>
                  <td style={{ padding:'12px 16px' }}>
                    <span style={{ fontSize:11, fontWeight:600, color:C.primary, background:C.primaryBg, borderRadius:6, padding:'3px 8px' }}>{a.role}</span>
                  </td>
                  <td style={{ padding:'12px 16px', fontSize:13, color:C.textSec }}>{a.phone}</td>
                  <td style={{ padding:'12px 16px' }}>
                    <span style={{ fontSize:11, fontWeight:600, color:C.success, background:C.successBg, borderRadius:6, padding:'3px 8px' }}>● 활성</span>
                  </td>
                  <td style={{ padding:'12px 16px' }}>
                    <div style={{ display:'flex', gap:6 }}>
                      <button style={{ padding:'6px 12px', borderRadius:7, border:`1px solid ${C.border}`, background:'#fff', cursor:'pointer', fontSize:12, fontWeight:600, color:C.textSec, fontFamily:"'Noto Sans KR', sans-serif" }}>수정</button>
                      <button style={{ padding:'6px 12px', borderRadius:7, border:`1px solid ${C.border}`, background:'#fff', cursor:'pointer', fontSize:12, fontWeight:600, color:C.textSec, fontFamily:"'Noto Sans KR', sans-serif" }}>비활성화</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {/* 모달 */}
      {modal && (
        <StaffModal
          mode={modal.mode === 'edit' ? 'edit' : 'add'}
          initial={modal.initial}
          onClose={() => setModal(null)}
          onSave={() => setModal(null)}
        />
      )}
    </div>
  );
}

function App() {
  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
      <Sidebar active="staff" />
      <StaffPage />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

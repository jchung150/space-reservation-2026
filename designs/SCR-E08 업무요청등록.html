<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCR-E08 업무 요청 등록 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app-header.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: oklch(92% 0.008 240);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    gap: 40px;
    flex-wrap: wrap;
  }
  @keyframes checkDraw {
    from { stroke-dashoffset: 60; opacity: 0; }
    to   { stroke-dashoffset: 0;  opacity: 1; }
  }
  @keyframes circlePop {
    0%   { transform: scale(0.6); opacity: 0; }
    60%  { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }
  .yj-input:focus, .yj-textarea:focus {
    border-color: oklch(55% 0.14 195) !important;
    background: #fff !important;
  }
</style>
</head>
<body>
<div id="root-form"></div>
<div id="root-success"></div>
<script type="text/babel">
const { useState, useRef } = React;

const C = {
  primary:  'oklch(55% 0.14 195)',
  danger:   'oklch(62% 0.16 25)',
  success:  'oklch(62% 0.15 160)',
  warning:  'oklch(75% 0.16 85)',
  border:   'oklch(88% 0.008 240)',
  cardBg:   'oklch(95% 0.005 220)',
  textPri:  'oklch(18% 0.01 260)',
  textSec:  'oklch(50% 0.01 260)',
};

// 데모용 더미 사진 색상
const PHOTO_COLORS = [
  'oklch(78% 0.08 200)', 'oklch(75% 0.09 145)', 'oklch(80% 0.07 50)',
];

const URGENCY = [
  { key: 'normal',   label: '일반',      color: C.textSec, bg: C.cardBg },
  { key: 'urgent',   label: '긴급',      color: C.warning, bg: 'oklch(96% 0.05 85)' },
  { key: 'critical', label: '매우 긴급', color: C.danger,  bg: 'oklch(96% 0.04 25)' },
];

const DEPTS = [
  { key: 'auto',     label: '자동 선택 (제목·내용으로 추천)' },
  { key: 'security', label: '보안' },
  { key: 'cleaning', label: '청소' },
  { key: 'facility', label: '시설유지보수' },
];

function FieldLabel({ children, required }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginBottom: 8 }}>
      <span style={{ fontSize: 14, fontWeight: 700, color: C.textPri }}>{children}</span>
      {required && (
        <span style={{
          fontSize: 11, fontWeight: 700, color: C.danger,
          background: 'oklch(96% 0.04 25)', padding: '1px 6px', borderRadius: 4,
        }}>필수</span>
      )}
      {!required && (
        <span style={{
          fontSize: 11, fontWeight: 600, color: C.textSec,
          background: C.cardBg, padding: '1px 6px', borderRadius: 4,
        }}>선택</span>
      )}
    </div>
  );
}

// ── 폼 화면 ─────────────────────────────────────────
function RequestForm({ onSubmit }) {
  const [title, setTitle]       = useState('');
  const [desc, setDesc]         = useState('');
  const [location, setLocation] = useState('');
  const [urgency, setUrgency]   = useState('normal');
  const [dept, setDept]         = useState('auto');
  const [deptOpen, setDeptOpen] = useState(false);
  const [photos, setPhotos]     = useState([]);
  const [showPhotoSheet, setShowPhotoSheet] = useState(false);

  const MAX_DESC = 500;
  const MAX_PHOTOS = 3;
  const isValid = title.trim().length > 0 && desc.trim().length >= 10 && location.trim().length > 0;
  const currentUrg = URGENCY.find(u => u.key === urgency);
  const currentDept = DEPTS.find(d => d.key === dept);

  function addDemoPhoto() {
    if (photos.length >= MAX_PHOTOS) return;
    setPhotos(prev => [...prev, PHOTO_COLORS[prev.length % PHOTO_COLORS.length]]);
    setShowPhotoSheet(false);
  }

  function removePhoto(i) {
    setPhotos(prev => prev.filter((_, idx) => idx !== i));
  }

  return (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', flexDirection: 'column',
      background: C.cardBg,
      fontFamily: "'Noto Sans KR', sans-serif",
      overflow: 'hidden', position: 'relative',
    }}>
      {/* 헤더 */}
      <div style={{ background: '#fff', borderBottom: `1px solid ${C.border}` }}>
        <div style={{
          padding: '44px 16px 10px',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div style={{
              width: 28, height: 28, borderRadius: 8, background: C.primary,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
            </div>
            <span style={{ fontSize: 16, fontWeight: 700, color: C.textPri }}>영준피엠씨</span>
          </div>
          <span style={{ fontSize: 13, fontWeight: 600, color: C.textSec }}>김현장</span>
        </div>
        <div style={{
          padding: '8px 16px 12px',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <button style={{
            display: 'flex', alignItems: 'center', gap: 2,
            background: 'none', border: 'none', cursor: 'pointer',
            color: C.textSec, fontSize: 15, fontWeight: 600, padding: '4px 0',
            fontFamily: "'Noto Sans KR', sans-serif",
          }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
            취소
          </button>
          <span style={{ fontSize: 16, fontWeight: 700, color: C.textPri }}>업무 요청 등록</span>
          <div style={{ width: 52 }} />
        </div>
      </div>

      {/* 안내 배너 */}
      <div style={{
        padding: '10px 16px',
        background: 'oklch(97% 0.025 195)',
        borderBottom: `1px solid ${C.border}`,
        display: 'flex', alignItems: 'flex-start', gap: 8,
      }}>
        <div style={{
          width: 18, height: 18, borderRadius: '50%',
          background: C.primary, color: '#fff',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: 12, fontWeight: 700, flexShrink: 0, marginTop: 1,
        }}>i</div>
        <span style={{ fontSize: 12.5, color: C.textPri, lineHeight: 1.5 }}>
          등록 즉시 관리자에게 전달되며, 담당자가 배정되면 알림으로 안내됩니다.
        </span>
      </div>

      {/* 스크롤 영역 */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '14px 16px 0' }}>

        {/* 제목 */}
        <div style={{
          background: '#fff', borderRadius: 12,
          border: `1px solid ${C.border}`,
          padding: '14px 14px', marginBottom: 12,
        }}>
          <FieldLabel required>요청 제목</FieldLabel>
          <input
            className="yj-input"
            type="text"
            value={title}
            onChange={e => setTitle(e.target.value.slice(0, 60))}
            placeholder="예: 3층 남자화장실 수도꼭지 누수"
            style={{
              width: '100%', height: 48,
              border: `1.5px solid ${C.border}`,
              borderRadius: 8, padding: '0 12px',
              fontSize: 15, color: C.textPri,
              fontFamily: "'Noto Sans KR', sans-serif",
              outline: 'none', background: C.cardBg,
              transition: '150ms ease',
            }}
          />
        </div>

        {/* 상세 내용 */}
        <div style={{
          background: '#fff', borderRadius: 12,
          border: `1px solid ${C.border}`,
          padding: '14px 14px', marginBottom: 12,
        }}>
          <FieldLabel required>상세 내용</FieldLabel>
          <textarea
            className="yj-textarea"
            value={desc}
            onChange={e => setDesc(e.target.value.slice(0, MAX_DESC))}
            placeholder="발견한 문제나 필요한 작업을 자세히 설명해주세요. 최소 10자 이상"
            style={{
              width: '100%', height: 112,
              border: `1.5px solid ${C.border}`,
              borderRadius: 8, padding: '10px 12px',
              fontSize: 14, color: C.textPri,
              fontFamily: "'Noto Sans KR', sans-serif",
              lineHeight: 1.6, resize: 'none',
              outline: 'none', background: C.cardBg,
              transition: '150ms ease',
            }}
          />
          <div style={{
            display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 6,
          }}>
            <span style={{ fontSize: 12, color: desc.length > 0 && desc.length < 10 ? C.danger : C.textSec }}>
              {desc.length > 0 && desc.length < 10 ? `최소 10자 필요 (${10 - desc.length}자 더)` : ''}
            </span>
            <span style={{ fontSize: 12, color: desc.length >= MAX_DESC ? C.danger : C.textSec }}>
              {desc.length} / {MAX_DESC}
            </span>
          </div>
        </div>

        {/* 위치 */}
        <div style={{
          background: '#fff', borderRadius: 12,
          border: `1px solid ${C.border}`,
          padding: '14px 14px', marginBottom: 12,
        }}>
          <FieldLabel required>발생 위치</FieldLabel>
          <div style={{ position: 'relative' }}>
            <svg
              width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke={C.textSec} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
              style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none' }}
            >
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            <input
              className="yj-input"
              type="text"
              value={location}
              onChange={e => setLocation(e.target.value.slice(0, 60))}
              placeholder="예: 3층 남자화장실 세 번째 칸"
              style={{
                width: '100%', height: 48,
                border: `1.5px solid ${C.border}`,
                borderRadius: 8, padding: '0 12px 0 36px',
                fontSize: 15, color: C.textPri,
                fontFamily: "'Noto Sans KR', sans-serif",
                outline: 'none', background: C.cardBg,
                transition: '150ms ease',
              }}
            />
          </div>
        </div>

        {/* 긴급도 — 시각적 강조 */}
        <div style={{
          background: '#fff', borderRadius: 12,
          border: urgency === 'critical' ? `1.5px solid ${C.danger}` :
                  urgency === 'urgent'   ? `1.5px solid ${C.warning}` :
                                           `1px solid ${C.border}`,
          padding: '14px 14px', marginBottom: 12,
          transition: '150ms ease',
        }}>
          <FieldLabel>긴급도</FieldLabel>
          <div style={{
            display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8,
          }}>
            {URGENCY.map(u => {
              const active = urgency === u.key;
              return (
                <button
                  key={u.key}
                  onClick={() => setUrgency(u.key)}
                  style={{
                    height: 52, borderRadius: 8,
                    border: active ? `2px solid ${u.color}` : `1.5px solid ${C.border}`,
                    background: active ? u.bg : '#fff',
                    color: active ? u.color : C.textPri,
                    fontSize: 14, fontWeight: active ? 700 : 600,
                    cursor: 'pointer',
                    display: 'flex', flexDirection: 'column',
                    alignItems: 'center', justifyContent: 'center', gap: 2,
                    fontFamily: "'Noto Sans KR', sans-serif",
                    transition: '150ms ease',
                  }}
                >
                  {u.key !== 'normal' && (
                    <span style={{
                      display: 'inline-flex', alignItems: 'center', gap: 4,
                      fontSize: 14, fontWeight: active ? 700 : 600,
                    }}>
                      {u.key === 'critical' && (
                        <span style={{
                          width: 6, height: 6, borderRadius: '50%',
                          background: u.color,
                          animation: active ? 'pulseDot 1.2s infinite' : 'none',
                        }} />
                      )}
                      {u.label}
                    </span>
                  )}
                  {u.key === 'normal' && u.label}
                </button>
              );
            })}
          </div>
          {urgency === 'critical' && (
            <div style={{
              marginTop: 10, padding: '8px 12px',
              background: 'oklch(96% 0.04 25)', borderRadius: 8,
              fontSize: 12.5, color: C.danger, fontWeight: 600,
              display: 'flex', alignItems: 'center', gap: 6,
            }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
              </svg>
              관리자에게 즉시 푸시 알림이 발송됩니다.
            </div>
          )}
        </div>

        {/* 담당 직군 */}
        <div style={{
          background: '#fff', borderRadius: 12,
          border: `1px solid ${C.border}`,
          padding: '14px 14px', marginBottom: 12,
        }}>
          <FieldLabel>담당 직군</FieldLabel>
          <button
            onClick={() => setDeptOpen(true)}
            style={{
              width: '100%', height: 48,
              border: `1.5px solid ${C.border}`,
              borderRadius: 8, padding: '0 12px',
              fontSize: 15, color: C.textPri, textAlign: 'left',
              fontFamily: "'Noto Sans KR', sans-serif",
              background: C.cardBg, cursor: 'pointer',
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              transition: '150ms ease',
            }}
          >
            <span>{currentDept.label}</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.textSec} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div style={{ fontSize: 12, color: C.textSec, marginTop: 8, lineHeight: 1.5 }}>
            관리자가 최종 담당자를 배정합니다.
          </div>
        </div>

        {/* 사진 첨부 */}
        <div style={{
          background: '#fff', borderRadius: 12,
          border: `1px solid ${C.border}`,
          padding: '14px 14px', marginBottom: 12,
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
            <FieldLabel>현장 사진</FieldLabel>
            <span style={{ fontSize: 12, color: C.textSec, fontWeight: 600 }}>
              {photos.length} / {MAX_PHOTOS}
            </span>
          </div>

          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
            {photos.map((color, i) => (
              <div key={i} style={{ position: 'relative', width: 76, height: 76 }}>
                <div style={{
                  width: 76, height: 76, borderRadius: 8, background: color,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  <span style={{ fontSize: 10, color: 'white', fontFamily: 'monospace' }}>사진 {i+1}</span>
                </div>
                <button
                  onClick={() => removePhoto(i)}
                  style={{
                    position: 'absolute', top: -6, right: -6,
                    width: 20, height: 20, borderRadius: '50%',
                    background: C.danger, border: '2px solid #fff',
                    color: '#fff', fontSize: 11, fontWeight: 700,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    cursor: 'pointer', lineHeight: 1,
                  }}
                >×</button>
              </div>
            ))}

            {photos.length < MAX_PHOTOS && (
              <button
                onClick={() => setShowPhotoSheet(true)}
                style={{
                  width: photos.length === 0 ? '100%' : 76,
                  height: photos.length === 0 ? 76 : 76,
                  borderRadius: 8,
                  border: `2px dashed ${C.border}`,
                  background: C.cardBg,
                  cursor: 'pointer',
                  display: 'flex',
                  flexDirection: photos.length === 0 ? 'row' : 'column',
                  alignItems: 'center', justifyContent: 'center', gap: 8,
                  color: C.textSec, transition: '150ms ease',
                  fontFamily: "'Noto Sans KR', sans-serif",
                }}
              >
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                  <circle cx="12" cy="13" r="4"/>
                </svg>
                {photos.length === 0 && (
                  <span style={{ fontSize: 14, fontWeight: 600 }}>사진 추가 (선택)</span>
                )}
              </button>
            )}
          </div>
        </div>

        <div style={{ height: 100 }} />
      </div>

      {/* 하단 고정 버튼 */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0,
        padding: '12px 16px 28px',
        background: '#fff', borderTop: `1px solid ${C.border}`,
      }}>
        <button
          disabled={!isValid}
          onClick={() => isValid && onSubmit()}
          style={{
            width: '100%', padding: '15px',
            borderRadius: 10, border: 'none',
            fontSize: 16, fontWeight: 700,
            cursor: isValid ? 'pointer' : 'not-allowed',
            background: isValid
              ? (urgency === 'critical' ? C.danger : C.primary)
              : C.border,
            color: isValid ? '#fff' : C.textSec,
            transition: '150ms ease',
            fontFamily: "'Noto Sans KR', sans-serif",
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
          }}
        >
          {!isValid ? (
            !title.trim() ? '요청 제목을 입력해주세요'
            : desc.trim().length < 10 ? `상세 내용 ${Math.max(0, 10 - desc.trim().length)}자 더 입력해주세요`
            : !location.trim() ? '발생 위치를 입력해주세요'
            : '요청 등록'
          ) : (
            <>
              {urgency === 'critical' && (
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                  <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
              )}
              {urgency === 'critical' ? '긴급 요청 등록' : '요청 등록'}
            </>
          )}
        </button>
      </div>

      {/* 직군 선택 바텀 시트 */}
      {deptOpen && (
        <div
          onClick={() => setDeptOpen(false)}
          style={{
            position: 'absolute', inset: 0,
            background: 'oklch(0% 0 0 / 40%)',
            display: 'flex', alignItems: 'flex-end',
            zIndex: 100,
          }}
        >
          <div
            onClick={e => e.stopPropagation()}
            style={{
              width: '100%', background: '#fff',
              borderRadius: '20px 20px 0 0',
              padding: '16px 16px 36px',
            }}
          >
            <div style={{ width: 36, height: 4, borderRadius: 2, background: C.border, margin: '0 auto 16px' }} />
            <div style={{ fontSize: 15, fontWeight: 700, color: C.textPri, marginBottom: 14, textAlign: 'center' }}>
              담당 직군 선택
            </div>
            {DEPTS.map(d => {
              const active = dept === d.key;
              return (
                <button
                  key={d.key}
                  onClick={() => { setDept(d.key); setDeptOpen(false); }}
                  style={{
                    width: '100%', padding: '14px 16px',
                    background: active ? 'oklch(97% 0.025 195)' : '#fff',
                    border: `1px solid ${active ? C.primary : C.border}`,
                    borderRadius: 10, cursor: 'pointer',
                    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                    marginBottom: 8, textAlign: 'left',
                    fontFamily: "'Noto Sans KR', sans-serif",
                  }}
                >
                  <span style={{ fontSize: 15, fontWeight: active ? 700 : 500, color: active ? C.primary : C.textPri }}>
                    {d.label}
                  </span>
                  {active && (
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={C.primary} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <polyline points="20 6 9 17 4 12"/>
                    </svg>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* 사진 선택 바텀 시트 */}
      {showPhotoSheet && (
        <div
          onClick={() => setShowPhotoSheet(false)}
          style={{
            position: 'absolute', inset: 0,
            background: 'oklch(0% 0 0 / 40%)',
            display: 'flex', alignItems: 'flex-end',
            zIndex: 100,
          }}
        >
          <div
            onClick={e => e.stopPropagation()}
            style={{
              width: '100%', background: '#fff',
              borderRadius: '20px 20px 0 0',
              padding: '16px 16px 36px',
            }}
          >
            <div style={{ width: 36, height: 4, borderRadius: 2, background: C.border, margin: '0 auto 16px' }} />
            <div style={{ fontSize: 15, fontWeight: 700, color: C.textPri, marginBottom: 14, textAlign: 'center' }}>
              사진 추가
            </div>
            {[
              { icon: '📷', label: '카메라로 촬영', sub: '지금 바로 촬영합니다' },
              { icon: '🖼', label: '갤러리에서 선택', sub: '저장된 사진을 선택합니다' },
            ].map(item => (
              <button
                key={item.label}
                onClick={addDemoPhoto}
                style={{
                  width: '100%', padding: '14px 16px',
                  background: C.cardBg, border: `1px solid ${C.border}`,
                  borderRadius: 10, cursor: 'pointer',
                  display: 'flex', alignItems: 'center', gap: 14,
                  marginBottom: 8, textAlign: 'left',
                  fontFamily: "'Noto Sans KR', sans-serif",
                }}
              >
                <span style={{ fontSize: 22 }}>{item.icon}</span>
                <div>
                  <div style={{ fontSize: 15, fontWeight: 600, color: C.textPri }}>{item.label}</div>
                  <div style={{ fontSize: 12, color: C.textSec, marginTop: 2 }}>{item.sub}</div>
                </div>
              </button>
            ))}
            <button
              onClick={() => setShowPhotoSheet(false)}
              style={{
                width: '100%', padding: '13px',
                border: 'none', background: 'none',
                fontSize: 15, fontWeight: 600, color: C.textSec,
                cursor: 'pointer', marginTop: 4,
                fontFamily: "'Noto Sans KR', sans-serif",
              }}
            >취소</button>
          </div>
        </div>
      )}
    </div>
  );
}

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCR-E01 로그인 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: oklch(92% 0.008 240);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    gap: 40px;
    flex-wrap: wrap;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-6px); }
    40%      { transform: translateX(6px); }
    60%      { transform: translateX(-4px); }
    80%      { transform: translateX(4px); }
  }
  .shake { animation: shake 0.35s ease; }
</style>
</head>
<body>
<div id="root"></div>
<div id="root2"></div>
<script type="text/babel">
const { useState, useRef } = React;

const C = {
  primary:  'oklch(55% 0.14 195)',
  danger:   'oklch(62% 0.16 25)',
  border:   'oklch(88% 0.008 240)',
  cardBg:   'oklch(95% 0.005 220)',
  textPri:  'oklch(18% 0.01 260)',
  textSec:  'oklch(50% 0.01 260)',
};

function IconEye({ off }) {
  return off ? (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
      <line x1="1" y1="1" x2="23" y2="23"/>
    </svg>
  ) : (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  );
}

function InputField({ label, type, value, onChange, error, placeholder, rightSlot }) {
  const [focused, setFocused] = useState(false);
  const borderColor = error ? C.danger : focused ? C.primary : C.border;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <label style={{ fontSize: 13, fontWeight: 600, color: C.textPri }}>{label}</label>
      <div style={{
        display: 'flex', alignItems: 'center',
        border: `1.5px solid ${borderColor}`,
        borderRadius: 8, background: focused ? '#fff' : C.cardBg,
        transition: '150ms ease', overflow: 'hidden',
      }}>
        <input
          type={type}
          value={value}
          onChange={onChange}
          placeholder={placeholder}
          onFocus={() => setFocused(true)}
          onBlur={() => setFocused(false)}
          style={{
            flex: 1, padding: '14px 14px',
            border: 'none', outline: 'none',
            background: 'transparent',
            fontSize: 15, color: C.textPri,
            fontFamily: "'Noto Sans KR', sans-serif",
          }}
        />
        {rightSlot && (
          <div style={{ paddingRight: 12, display: 'flex', alignItems: 'center' }}>
            {rightSlot}
          </div>
        )}
      </div>
      {error && (
        <span style={{ fontSize: 12, color: C.danger, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 4 }}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {error}
        </span>
      )}
    </div>
  );
}

// ── 정상 상태 로그인 화면 ─────────────────────────────
function LoginNormal() {
  const [id, setId]             = useState('');
  const [pw, setPw]             = useState('');
  const [showPw, setShowPw]     = useState(false);
  const [autoLogin, setAutoLogin] = useState(false);

  const canSubmit = id.length > 0 && pw.length > 0;

  return (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', flexDirection: 'column',
      background: '#fff',
      fontFamily: "'Noto Sans KR', sans-serif",
      padding: '0 24px',
      justifyContent: 'center',
    }}>
      {/* 로고 영역 */}
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', marginBottom: 44 }}>
        <div style={{
          width: 64, height: 64, borderRadius: 18,
          background: C.primary,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          marginBottom: 14,
          boxShadow: `0 4px 16px oklch(55% 0.14 195 / 30%)`,
        }}>
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <div style={{ fontSize: 22, fontWeight: 700, color: C.textPri, marginBottom: 4 }}>영준피엠씨</div>
        <div style={{ fontSize: 13, color: C.textSec }}>시설 관리 시스템</div>
      </div>

      {/* 입력 폼 */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16, marginBottom: 16 }}>
        <InputField
          label="아이디"
          type="text"
          value={id}
          onChange={e => setId(e.target.value)}
          placeholder="아이디를 입력하세요"
        />
        <InputField
          label="비밀번호"
          type={showPw ? 'text' : 'password'}
          value={pw}
          onChange={e => setPw(e.target.value)}
          placeholder="비밀번호를 입력하세요"
          rightSlot={
            <button
              onClick={() => setShowPw(v => !v)}
              style={{ background: 'none', border: 'none', cursor: 'pointer', color: C.textSec, padding: 0, display: 'flex' }}
            >
              <IconEye off={!showPw} />
            </button>
          }
        />
      </div>

      {/* 자동 로그인 */}
      <label style={{
        display: 'flex', alignItems: 'center', gap: 8,
        cursor: 'pointer', marginBottom: 24, userSelect: 'none',
      }}>
        <div
          onClick={() => setAutoLogin(v => !v)}
          style={{
            width: 20, height: 20, borderRadius: 5,
            border: `2px solid ${autoLogin ? C.primary : C.border}`,
            background: autoLogin ? C.primary : '#fff',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            transition: '150ms ease', flexShrink: 0,
          }}
        >
          {autoLogin && (
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          )}
        </div>
        <span style={{ fontSize: 14, color: C.textPri }}>자동 로그인</span>
      </label>

      {/* 로그인 버튼 */}
      <button style={{
        width: '100%', padding: '16px',
        borderRadius: 10, border: 'none',
        background: canSubmit ? C.primary : C.border,
        color: canSubmit ? '#fff' : C.textSec,
        fontSize: 16, fontWeight: 700,
        cursor: canSubmit ? 'pointer' : 'not-allowed',
        fontFamily: "'Noto Sans KR', sans-serif",
        transition: '150ms ease',
        marginBottom: 24,
      }}>
        로그인
      </button>

      {/* 하단 안내 */}
      <div style={{ textAlign: 'center', fontSize: 13, color: C.textSec, lineHeight: 1.6 }}>
        계정 문의는 관리자에게 연락하세요.
      </div>
    </div>
  );
}

// ── 오류 상태 로그인 화면 ─────────────────────────────
function LoginError() {
  const [id]     = useState('kim123');
  const [pw]     = useState('wrongpw');
  const [showPw, setShowPw] = useState(false);
  const [shake, setShake]   = useState(true);

  return (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', flexDirection: 'column',
      background: '#fff',
      fontFamily: "'Noto Sans KR', sans-serif",
      padding: '0 24px',
      justifyContent: 'center',
    }}>
      {/* 로고 */}
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', marginBottom: 44 }}>
        <div style={{
          width: 64, height: 64, borderRadius: 18,
          background: C.primary,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          marginBottom: 14,
          boxShadow: `0 4px 16px oklch(55% 0.14 195 / 30%)`,
        }}>
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <div style={{ fontSize: 22, fontWeight: 700, color: C.textPri, marginBottom: 4 }}>영준피엠씨</div>
        <div style={{ fontSize: 13, color: C.textSec }}>시설 관리 시스템</div>
      </div>

      {/* 오류 배너 */}
      <div className={shake ? 'shake' : ''} style={{
        display: 'flex', alignItems: 'center', gap: 8,
        background: 'oklch(96% 0.04 25)',
        border: `1px solid oklch(88% 0.08 25)`,
        borderRadius: 8, padding: '10px 14px', marginBottom: 16,
      }}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.danger} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span style={{ fontSize: 13, color: C.danger, fontWeight: 600 }}>
          아이디 또는 비밀번호가 올바르지 않습니다.
        </span>
      </div>

      {/* 폼 */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16, marginBottom: 16 }}>
        <InputField
          label="아이디"
          type="text"
          value={id}
          onChange={() => {}}
          error="아이디를 확인해주세요"
        />
        <InputField
          label="비밀번호"
          type={showPw ? 'text' : 'password'}
          value={pw}
          onChange={() => {}}
          error="비밀번호를 확인해주세요"
          rightSlot={
            <button onClick={() => setShowPw(v => !v)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: C.textSec, padding: 0, display: 'flex' }}>
              <IconEye off={!showPw} />
            </button>
          }
        />
      </div>

      <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', marginBottom: 24, userSelect: 'none' }}>
        <div style={{
          width: 20, height: 20, borderRadius: 5,
          border: `2px solid ${C.border}`, background: '#fff',
          flexShrink: 0,
        }} />
        <span style={{ fontSize: 14, color: C.textPri }}>자동 로그인</span>
      </label>

      <button style={{
        width: '100%', padding: '16px',
        borderRadius: 10, border: 'none',
        background: C.primary, color: '#fff',
        fontSize: 16, fontWeight: 700,
        cursor: 'pointer',
        fontFamily: "'Noto Sans KR', sans-serif",
        marginBottom: 24,
      }}>
        로그인
      </button>

      <div style={{ textAlign: 'center', fontSize: 13, color: C.textSec }}>
        계정 문의는 관리자에게 연락하세요.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <IOSDevice width={390} height={844} time="09:41"><LoginNormal /></IOSDevice>
);
ReactDOM.createRoot(document.getElementById('root2')).render(
  <IOSDevice width={390} height={844} time="09:41"><LoginError /></IOSDevice>
);
</script>
</body>
</html>

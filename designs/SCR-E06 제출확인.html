<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCR-E06 보고 제출 확인 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app-header.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: oklch(92% 0.008 240);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    gap: 40px;
    flex-wrap: wrap;
  }
  @keyframes checkDraw {
    from { stroke-dashoffset: 60; opacity: 0; }
    to   { stroke-dashoffset: 0;  opacity: 1; }
  }
  @keyframes circlePop {
    0%   { transform: scale(0.6); opacity: 0; }
    60%  { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="root2"></div>
<script type="text/babel">
const { useState } = React;

const C = {
  primary:  'oklch(55% 0.14 195)',
  danger:   'oklch(62% 0.16 25)',
  success:  'oklch(62% 0.15 160)',
  warning:  'oklch(75% 0.16 85)',
  border:   'oklch(88% 0.008 240)',
  cardBg:   'oklch(95% 0.005 220)',
  textPri:  'oklch(18% 0.01 260)',
  textSec:  'oklch(50% 0.01 260)',
};

const PRIORITY_MAP = {
  high:   { label: '높음', color: C.danger,  dot: '#ef4444' },
  medium: { label: '보통', color: C.warning, dot: '#f97316' },
  low:    { label: '낮음', color: C.success, dot: '#22c55e' },
};

const SAMPLE = {
  task: { name: '1층 로비 소화기 점검', priority: 'high', due: '2026년 4월 25일 14:00' },
  photos: [
    'oklch(78% 0.08 200)',
    'oklch(75% 0.09 145)',
    'oklch(80% 0.07 50)',
  ],
  memo: '1층 로비 소화기 3개 모두 압력 게이지 정상 범위(녹색 구간) 확인 완료하였습니다. 안전핀 이탈 없음, 외관 손상 없음. 점검 라벨 신규 부착 완료. 이상 없음.',
};

function SectionTitle({ children }) {
  return (
    <div style={{ fontSize: 13, fontWeight: 700, color: C.textSec, marginBottom: 10, letterSpacing: '0.02em' }}>
      {children}
    </div>
  );
}

// ── 확인 화면 ─────────────────────────────────────────
function ConfirmScreen({ onSubmit }) {
  const { task, photos, memo } = SAMPLE;
  const p = PRIORITY_MAP[task.priority];
  const [lightboxIdx, setLightboxIdx] = useState(null);

  return (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', flexDirection: 'column',
      background: C.cardBg,
      fontFamily: "'Noto Sans KR', sans-serif",
      overflow: 'hidden', position: 'relative',
    }}>
      {/* 헤더 */}
      <AppHeader variant="detail" title="제출 전 확인" />

      {/* 스크롤 영역 */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '16px 16px 0' }}>

        {/* 업무 정보 카드 */}
        <div style={{
          background: '#fff', borderRadius: 12,
          border: `1px solid ${C.border}`,
          padding: '16px', marginBottom: 12,
        }}>
          <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
            <span style={{
              display: 'inline-flex', alignItems: 'center', gap: 4,
              fontSize: 11, fontWeight: 600, color: p.color,
              background: `${p.color}18`, borderRadius: 6, padding: '2px 8px',
            }}>
              <span style={{ width: 5, height: 5, borderRadius: '50%', background: p.dot }} />
              {p.label}
            </span>
          </div>
          <div style={{ fontSize: 17, fontWeight: 700, color: C.textPri, marginBottom: 10 }}>{task.name}</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, color: C.textSec, fontSize: 13 }}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            마감 {task.due}
          </div>
        </div>

        {/* 첨부 사진 */}
        <div style={{
          background: '#fff', borderRadius: 12,
          border: `1px solid ${C.border}`,
          padding: '16px', marginBottom: 12,
        }}>
          <SectionTitle>첨부 사진 ({photos.length}장)</SectionTitle>
          <div style={{ display: 'flex', gap: 10, overflowX: 'auto', paddingBottom: 4 }}>
            {photos.map((color, i) => (
              <div
                key={i}
                onClick={() => setLightboxIdx(i)}
                style={{
                  width: 90, height: 90, borderRadius: 8,
                  background: color, flexShrink: 0,
                  cursor: 'pointer', position: 'relative',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  transition: '150ms ease',
                }}
              >
                <span style={{ fontSize: 11, color: 'white', fontFamily: 'monospace' }}>사진 {i+1}</span>
                <div style={{
                  position: 'absolute', inset: 0, borderRadius: 8,
                  background: 'oklch(0% 0 0 / 0%)',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ opacity: 0.8 }}>
                    <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                  </svg>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* 완료 메모 */}
        <div style={{
          background: '#fff', borderRadius: 12,
          border: `1px solid ${C.border}`,
          padding: '16px', marginBottom: 12,
        }}>
          <SectionTitle>완료 메모</SectionTitle>
          <p style={{ fontSize: 14, color: C.textPri, lineHeight: 1.7 }}>{memo}</p>
        </div>

        {/* 제출 안내 */}
        <div style={{
          display: 'flex', gap: 10, alignItems: 'flex-start',
          background: 'oklch(96% 0.05 85)',
          border: `1px solid oklch(88% 0.08 85)`,
          borderRadius: 10, padding: '12px 14px', marginBottom: 12,
        }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(60% 0.16 65)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0, marginTop: 1 }}>
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          <span style={{ fontSize: 13, color: 'oklch(40% 0.08 65)', lineHeight: 1.6 }}>
            제출 후에는 수정이 불가능합니다.<br/>내용을 다시 한번 확인해주세요.
          </span>
        </div>

        <div style={{ height: 96 }} />
      </div>

      {/* 하단 버튼 */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0,
        padding: '12px 16px 28px',
        background: '#fff', borderTop: `1px solid ${C.border}`,
        display: 'flex', gap: 10,
      }}>
        <button style={{
          flex: 1, padding: '14px', borderRadius: 10,
          border: `1.5px solid ${C.border}`, background: '#fff',
          fontSize: 15, fontWeight: 600, color: C.textSec, cursor: 'pointer',
          fontFamily: "'Noto Sans KR', sans-serif",
        }}>수정하기</button>
        <button
          onClick={onSubmit}
          style={{
            flex: 2, padding: '14px', borderRadius: 10,
            border: 'none', background: C.primary,
            fontSize: 15, fontWeight: 700, color: '#fff', cursor: 'pointer',
            fontFamily: "'Noto Sans KR', sans-serif",
          }}
        >최종 제출</button>
      </div>

      {/* 라이트박스 */}
      {lightboxIdx !== null && (
        <div
          onClick={() => setLightboxIdx(null)}
          style={{
            position: 'absolute', inset: 0, zIndex: 200,
            background: 'oklch(5% 0 0 / 90%)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            flexDirection: 'column', gap: 12,
          }}
        >
          <div style={{
            width: 260, height: 260, borderRadius: 12,
            background: photos[lightboxIdx],
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <span style={{ color: 'white', fontSize: 14, fontFamily: 'monospace' }}>사진 {lightboxIdx + 1}</span>
          </div>
          <span style={{ color: 'oklch(70% 0 0)', fontSize: 13 }}>탭하면 닫힙니다</span>
        </div>
      )}
    </div>
  );
}

// ── 제출 완료 화면 ────────────────────────────────────
function SuccessScreen() {
  return (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      background: '#fff',
      fontFamily: "'Noto Sans KR', sans-serif",
      padding: '0 32px',
      gap: 0,
    }}>
      {/* 체크 아이콘 */}
      <div style={{
        width: 88, height: 88, borderRadius: '50%',
        background: 'oklch(92% 0.06 160)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        marginBottom: 24,
        animation: 'circlePop 0.5s cubic-bezier(0.34,1.56,0.64,1) both',
      }}>
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none"
          stroke={C.success} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
          style={{
            strokeDasharray: 60,
            strokeDashoffset: 0,
            animation: 'checkDraw 0.4s 0.3s ease both',
          }}>
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>

      {/* 메시지 */}
      <div style={{
        fontSize: 22, fontWeight: 700, color: C.textPri,
        marginBottom: 10, textAlign: 'center',
        animation: 'fadeUp 0.4s 0.5s ease both', opacity: 0,
        animationFillMode: 'forwards',
      }}>보고가 제출되었습니다.</div>

      <div style={{
        fontSize: 14, color: C.textSec, textAlign: 'center', lineHeight: 1.7,
        marginBottom: 40,
        animation: 'fadeUp 0.4s 0.65s ease both', opacity: 0,
        animationFillMode: 'forwards',
      }}>
        관리자가 검토 후 승인 처리할 예정입니다.<br/>결과는 업무 상세에서 확인할 수 있어요.
      </div>

      {/* 제출 요약 */}
      <div style={{
        width: '100%', background: C.cardBg, borderRadius: 12,
        border: `1px solid ${C.border}`, padding: '14px 16px',
        marginBottom: 32,
        animation: 'fadeUp 0.4s 0.75s ease both', opacity: 0,
        animationFillMode: 'forwards',
      }}>
        <div style={{ fontSize: 13, color: C.textSec, marginBottom: 4 }}>제출한 업무</div>
        <div style={{ fontSize: 15, fontWeight: 700, color: C.textPri }}>1층 로비 소화기 점검</div>
        <div style={{ fontSize: 12, color: C.textSec, marginTop: 6 }}>사진 3장 · 메모 포함</div>
      </div>

      {/* 홈으로 버튼 */}
      <button style={{
        width: '100%', padding: '15px',
        borderRadius: 10, border: 'none',
        background: C.primary, color: '#fff',
        fontSize: 16, fontWeight: 700, cursor: 'pointer',
        fontFamily: "'Noto Sans KR', sans-serif",
        animation: 'fadeUp 0.4s 0.85s ease both', opacity: 0,
        animationFillMode: 'forwards',
      }}>
        홈으로 돌아가기
      </button>
    </div>
  );
}

// ── 확인 화면 앱 ─────────────────────────────────────
function ConfirmApp() {
  const [submitted, setSubmitted] = useState(false);
  return (
    <IOSDevice width={390} height={844} time="09:41">
      {submitted ? <SuccessScreen /> : <ConfirmScreen onSubmit={() => setSubmitted(true)} />}
    </IOSDevice>
  );
}

// ── 성공 화면 단독 앱 ─────────────────────────────────
function SuccessApp() {
  return (
    <IOSDevice width={390} height={844} time="09:41">
      <SuccessScreen />
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ConfirmApp />);
ReactDOM.createRoot(document.getElementById('root2')).render(<SuccessApp />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCR-E07 내 프로필</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { font-family: 'Noto Sans KR', sans-serif; background: oklch(95% 0.005 220); display:flex; align-items:center; justify-content:center; }
  ::-webkit-scrollbar { width: 0; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel">
const { useState } = React;

const C = {
  primary:   'oklch(55% 0.14 195)',
  primaryBg: 'oklch(93% 0.06 195)',
  danger:    'oklch(62% 0.16 25)',
  dangerBg:  'oklch(95% 0.04 25)',
  success:   'oklch(62% 0.15 160)',
  successBg: 'oklch(93% 0.05 160)',
  warning:   'oklch(65% 0.16 65)',
  border:    'oklch(88% 0.008 240)',
  cardBg:    '#ffffff',
  pageBg:    'oklch(95% 0.005 220)',
  textPri:   'oklch(18% 0.01 260)',
  textSec:   'oklch(50% 0.01 260)',
  textMuted: 'oklch(65% 0.01 260)',
};

const DEPT_COLOR = { 보안:'oklch(65% 0.16 65)', 청소:'oklch(62% 0.15 160)', 시설:'oklch(55% 0.14 195)' };

const ME = {
  name: '김보안',
  dept: '보안',
  loginId: 'kim.security',
  phone: '010-1234-5678',
  joinedAt: '2024년 8월 12일',
  active: true,
  done: 12, assigned: 15, rate: 80,
};

// ── 헤더 ──────────────────────────────────────────
function Header() {
  return (
    <div style={{
      paddingTop:44, paddingBottom:14, paddingLeft:16, paddingRight:16,
      background:'#fff', borderBottom:`1px solid ${C.border}`,
      display:'flex', alignItems:'center', justifyContent:'center',
    }}>
      <h1 style={{ fontSize:17, fontWeight:700, color:C.textPri }}>내 프로필</h1>
    </div>
  );
}

// ── 프로필 카드 ────────────────────────────────────
function ProfileCard() {
  const dc = DEPT_COLOR[ME.dept];
  return (
    <div style={{
      background:`linear-gradient(180deg, ${C.cardBg} 0%, ${C.pageBg} 100%)`,
      padding:'28px 20px 24px',
      display:'flex', flexDirection:'column', alignItems:'center', gap:12,
      borderBottom:`1px solid ${C.border}`,
    }}>
      <div style={{
        width:88, height:88, borderRadius:'50%',
        background:`${dc}18`, border:`3px solid ${dc}`,
        display:'flex', alignItems:'center', justifyContent:'center',
        fontSize:36, fontWeight:700, color:dc,
        boxShadow:`0 4px 16px ${dc}30`,
      }}>{ME.name[0]}</div>
      <div style={{ fontSize:22, fontWeight:700, color:C.textPri }}>{ME.name}</div>
      <div style={{ display:'flex', gap:6 }}>
        <span style={{ display:'inline-flex', alignItems:'center', gap:5, fontSize:12, fontWeight:600, color:dc, background:`${dc}18`, borderRadius:6, padding:'4px 10px' }}>
          <span style={{ width:5, height:5, borderRadius:'50%', background:dc }} />
          {ME.dept}
        </span>
        <span style={{ fontSize:12, fontWeight:600, color:C.success, background:C.successBg, borderRadius:6, padding:'4px 10px' }}>● 활성</span>
      </div>
    </div>
  );
}

// ── 정보 행 ────────────────────────────────────────
function InfoRow({ label, value, last }) {
  return (
    <div style={{
      display:'flex', justifyContent:'space-between', alignItems:'center',
      padding:'14px 16px',
      borderBottom: last ? 'none' : `1px solid ${C.border}`,
    }}>
      <span style={{ fontSize:13, color:C.textSec }}>{label}</span>
      <span style={{ fontSize:14, fontWeight:600, color:C.textPri, fontVariantNumeric:'tabular-nums' }}>{value}</span>
    </div>
  );
}

// ── 통계 카드 ──────────────────────────────────────
function StatCard({ label, value, unit, color }) {
  return (
    <div style={{
      flex:1, background:C.cardBg, borderRadius:12,
      border:`1px solid ${C.border}`, padding:'14px 12px',
      display:'flex', flexDirection:'column', alignItems:'center', gap:4,
    }}>
      <div style={{ fontSize:11, fontWeight:600, color:C.textMuted, letterSpacing:'0.04em' }}>{label}</div>
      <div style={{ display:'flex', alignItems:'baseline', gap:2 }}>
        <span style={{ fontSize:24, fontWeight:700, color:color || C.textPri, lineHeight:1 }}>{value}</span>
        <span style={{ fontSize:11, color:C.textMuted, fontWeight:600 }}>{unit}</span>
      </div>
    </div>
  );
}

// ── 비밀번호 변경 시트 ────────────────────────────
function PasswordSheet({ onClose, onSubmit }) {
  const [cur, setCur]   = useState('');
  const [next, setNext] = useState('');
  const [conf, setConf] = useState('');
  const [err, setErr]   = useState('');

  function submit() {
    if (!cur)             return setErr('현재 비밀번호를 입력해주세요');
    if (!next)            return setErr('새 비밀번호를 입력해주세요');
    if (next.length < 6)  return setErr('새 비밀번호는 6자 이상이어야 합니다');
    if (next !== conf)    return setErr('새 비밀번호가 일치하지 않습니다');
    onSubmit();
  }

  const inputStyle = {
    width:'100%', padding:'12px 14px', borderRadius:10,
    border:`1.5px solid ${C.border}`, background:C.pageBg,
    fontSize:15, color:C.textPri, outline:'none',
    fontFamily:"'Noto Sans KR', sans-serif",
  };
  const Lbl = ({ children }) => (
    <div style={{ fontSize:13, fontWeight:600, color:C.textPri, marginBottom:6 }}>{children}</div>
  );

  return (
    <div onClick={onClose} style={{
      position:'absolute', inset:0, background:'oklch(0% 0 0 / 45%)',
      zIndex:50, animation:'fadeIn 0.2s ease',
      display:'flex', alignItems:'flex-end',
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        width:'100%', background:C.cardBg,
        borderRadius:'18px 18px 0 0',
        animation:'slideUp 0.3s cubic-bezier(0.34,1.2,0.64,1)',
        maxHeight:'85%', overflowY:'auto',
      }}>
        <div style={{ display:'flex', justifyContent:'center', paddingTop:8 }}>
          <div style={{ width:36, height:4, borderRadius:2, background:C.border }} />
        </div>
        <div style={{ padding:'14px 20px 8px', borderBottom:`1px solid ${C.border}` }}>
          <h2 style={{ fontSize:17, fontWeight:700, color:C.textPri }}>비밀번호 변경</h2>
          <div style={{ fontSize:12, color:C.textMuted, marginTop:3, marginBottom:8 }}>안전한 새 비밀번호로 변경하세요</div>
        </div>
        <div style={{ padding:'18px 20px 20px' }}>
          <div style={{ marginBottom:14 }}>
            <Lbl>현재 비밀번호</Lbl>
            <input type="password" value={cur} onChange={e => setCur(e.target.value)} placeholder="현재 비밀번호" style={inputStyle} />
          </div>
          <div style={{ marginBottom:14 }}>
            <Lbl>새 비밀번호</Lbl>
            <input type="password" value={next} onChange={e => setNext(e.target.value)} placeholder="6자 이상" style={inputStyle} />
          </div>
          <div style={{ marginBottom:14 }}>
            <Lbl>새 비밀번호 확인</Lbl>
            <input type="password" value={conf} onChange={e => setConf(e.target.value)} placeholder="다시 한 번 입력" style={inputStyle} />
          </div>

          {err && (
            <div style={{
              background:C.dangerBg, border:`1px solid ${C.danger}40`,
              borderRadius:10, padding:'10px 12px', marginBottom:14,
              display:'flex', alignItems:'center', gap:8,
              fontSize:13, fontWeight:600, color:C.danger,
            }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              {err}
            </div>
          )}

          <div style={{ display:'flex', gap:10, marginTop:6 }}>
            <button onClick={onClose} style={{
              flex:1, padding:'14px', borderRadius:10,
              border:`1.5px solid ${C.border}`, background:'#fff',
              fontSize:15, fontWeight:600, color:C.textSec, cursor:'pointer',
              fontFamily:"'Noto Sans KR', sans-serif",
            }}>취소</button>
            <button onClick={submit} style={{
              flex:1.4, padding:'14px', borderRadius:10, border:'none',
              background:C.primary, color:'#fff',
              fontSize:15, fontWeight:700, cursor:'pointer',
              fontFamily:"'Noto Sans KR', sans-serif",
              boxShadow:`0 2px 8px oklch(55% 0.14 195 / 30%)`,
            }}>변경하기</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── 로그아웃 확인 다이얼로그 ──────────────────────
function LogoutDialog({ onClose, onConfirm }) {
  return (
    <div onClick={onClose} style={{
      position:'absolute', inset:0, background:'oklch(0% 0 0 / 45%)',
      zIndex:50, animation:'fadeIn 0.2s ease',
      display:'flex', alignItems:'center', justifyContent:'center', padding:24,
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        width:'100%', maxWidth:300, background:C.cardBg, borderRadius:14,
        animation:'scaleIn 0.2s cubic-bezier(0.34,1.2,0.64,1)',
        overflow:'hidden',
      }}>
        <div style={{ padding:'22px 20px 18px', textAlign:'center' }}>
          <div style={{ width:48, height:48, borderRadius:'50%', background:C.dangerBg, display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 12px' }}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={C.danger} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </div>
          <div style={{ fontSize:16, fontWeight:700, color:C.textPri, marginBottom:6 }}>로그아웃 하시겠습니까?</div>
          <div style={{ fontSize:13, color:C.textSec, lineHeight:1.5 }}>
            로그아웃 시 다음 사용을 위해<br/>다시 로그인이 필요합니다
          </div>
        </div>
        <div style={{ display:'flex', borderTop:`1px solid ${C.border}` }}>
          <button onClick={onClose} style={{
            flex:1, padding:'14px', border:'none', background:'transparent',
            fontSize:15, fontWeight:600, color:C.textSec, cursor:'pointer',
            fontFamily:"'Noto Sans KR', sans-serif",
            borderRight:`1px solid ${C.border}`,
          }}>취소</button>
          <button onClick={onConfirm} style={{
            flex:1, padding:'14px', border:'none', background:'transparent',
            fontSize:15, fontWeight:700, color:C.danger, cursor:'pointer',
            fontFamily:"'Noto Sans KR', sans-serif",
          }}>로그아웃</button>
        </div>
      </div>
    </div>
  );
}

// ── 성공 토스트 ───────────────────────────────────
function Toast({ msg }) {
  return (
    <div style={{
      position:'absolute', bottom:90, left:'50%', transform:'translateX(-50%)',
      background:C.textPri, color:'#fff',
      padding:'10px 18px', borderRadius:10,
      fontSize:13, fontWeight:600, zIndex:60,
      boxShadow:'0 4px 16px oklch(0% 0 0 / 25%)',
      display:'flex', alignItems:'center', gap:6,
      animation:'fadeIn 0.2s ease',
    }}>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.success} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      {msg}
    </div>
  );
}

// ── 하단 탭바 ─────────────────────────────────────
function TabBar({ active }) {
  const tabs = [
    { key:'home',     label:'업무',    icon: <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/> },
    { key:'calendar', label:'캘린더',  icon: <><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></> },
    { key:'profile',  label:'프로필',  icon: <><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></> },
  ];
  return (
    <div style={{
      borderTop:`1px solid ${C.border}`,
      background:'#fff', padding:'8px 0 28px',
      display:'flex', justifyContent:'space-around',
    }}>
      {tabs.map(t => (
        <button key={t.key} style={{
          flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:3,
          padding:'6px 0', border:'none', background:'none', cursor:'pointer',
          color: active===t.key ? C.primary : C.textMuted,
          fontFamily:"'Noto Sans KR', sans-serif",
        }}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={active===t.key ? 2.4 : 1.8} strokeLinecap="round" strokeLinejoin="round">
            {t.icon}
          </svg>
          <span style={{ fontSize:10, fontWeight: active===t.key ? 700 : 500 }}>{t.label}</span>
        </button>
      ))}
    </div>
  );
}

// ── 메인 ──────────────────────────────────────────
function ProfileScreen() {
  const [pwSheet, setPwSheet] = useState(false);
  const [logout, setLogout]   = useState(false);
  const [toast, setToast]     = useState('');

  function handlePwSuccess() {
    setPwSheet(false);
    setToast('비밀번호가 변경되었습니다');
    setTimeout(() => setToast(''), 2400);
  }

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:C.pageBg, position:'relative' }}>
      <Header />

      <div style={{ flex:1, overflowY:'auto' }}>
        <ProfileCard />

        {/* 계정 정보 */}
        <div style={{ padding:'18px 16px 4px' }}>
          <div style={{ fontSize:12, fontWeight:700, color:C.textMuted, letterSpacing:'0.06em', marginBottom:10, paddingLeft:4 }}>계정 정보</div>
          <div style={{ background:C.cardBg, borderRadius:12, border:`1px solid ${C.border}` }}>
            <InfoRow label="아이디"  value={ME.loginId} />
            <InfoRow label="연락처"  value={ME.phone} />
            <InfoRow label="직군"    value={ME.dept} />
            <InfoRow label="가입일"  value={ME.joinedAt} last />
          </div>
        </div>

        {/* 업무 현황 */}
        <div style={{ padding:'18px 16px 4px' }}>
          <div style={{ fontSize:12, fontWeight:700, color:C.textMuted, letterSpacing:'0.06em', marginBottom:10, paddingLeft:4 }}>나의 업무 현황 · 이번 달</div>
          <div style={{ display:'flex', gap:8 }}>
            <StatCard label="완료"  value={ME.done}     unit="건" color={C.success} />
            <StatCard label="배정"  value={ME.assigned} unit="건" />
            <StatCard label="완료율" value={ME.rate}     unit="%"  color={C.primary} />
          </div>
        </div>

        {/* 액션 */}
        <div style={{ padding:'24px 16px 28px', display:'flex', flexDirection:'column', gap:10 }}>
          <button onClick={() => setPwSheet(true)} style={{
            padding:'14px', borderRadius:10,
            border:`1.5px solid ${C.border}`, background:'#fff',
            fontSize:15, fontWeight:600, color:C.textPri, cursor:'pointer',
            fontFamily:"'Noto Sans KR', sans-serif",
            display:'flex', alignItems:'center', justifyContent:'center', gap:8,
          }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            비밀번호 변경
          </button>
          <button onClick={() => setLogout(true)} style={{
            padding:'14px', borderRadius:10,
            border:`1.5px solid ${C.danger}`, background:C.dangerBg,
            fontSize:15, fontWeight:700, color:C.danger, cursor:'pointer',
            fontFamily:"'Noto Sans KR', sans-serif",
            display:'flex', alignItems:'center', justifyContent:'center', gap:8,
          }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            로그아웃
          </button>
        </div>

        {/* 앱 버전 */}
        <div style={{ textAlign:'center', padding:'4px 16px 24px', fontSize:11, color:C.textMuted }}>
          영준피엠씨 시설관리 · v1.0.0
        </div>
      </div>

      <TabBar active="profile" />

      {pwSheet && <PasswordSheet onClose={() => setPwSheet(false)} onSubmit={handlePwSuccess} />}
      {logout  && <LogoutDialog  onClose={() => setLogout(false)}  onConfirm={() => setLogout(false)} />}
      {toast   && <Toast msg={toast} />}
    </div>
  );
}

function App() {
  return (
    <IOSDevice>
      <ProfileScreen />
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

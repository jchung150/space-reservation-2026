<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCR-A08 업무 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { font-family: 'Noto Sans KR', sans-serif; background: oklch(95% 0.005 220); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: oklch(80% 0.01 240); border-radius: 3px; }
  select { appearance: none; -webkit-appearance: none; }
  input[type="date"] { appearance: none; -webkit-appearance: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const C = {
  primary:   'oklch(55% 0.14 195)',
  primaryBg: 'oklch(93% 0.06 195)',
  danger:    'oklch(62% 0.16 25)',
  dangerBg:  'oklch(95% 0.04 25)',
  success:   'oklch(62% 0.15 160)',
  successBg: 'oklch(93% 0.05 160)',
  warning:   'oklch(65% 0.16 65)',
  warningBg: 'oklch(95% 0.05 85)',
  border:    'oklch(88% 0.008 240)',
  cardBg:    '#ffffff',
  pageBg:    'oklch(95% 0.005 220)',
  archive:   'oklch(96% 0.008 240)',
  sidebar:   'oklch(16% 0.02 250)',
  textPri:   'oklch(18% 0.01 260)',
  textSec:   'oklch(50% 0.01 260)',
  textMuted: 'oklch(65% 0.01 260)',
};
const DEPT_COLOR = { 보안:'oklch(65% 0.16 65)', 청소:'oklch(62% 0.15 160)', 시설:'oklch(55% 0.14 195)' };
const PRIORITY_MAP = {
  high:   { label:'높음', color: C.danger,  bg: C.dangerBg },
  medium: { label:'보통', color: C.warning, bg: C.warningBg },
  low:    { label:'낮음', color: C.success, bg: C.successBg },
};

const NAV_ITEMS = [
  { key:'dashboard', label:'대시보드' },
  { key:'tasks',     label:'업무 관리' },
  { key:'reports',   label:'완료 보고 검토', badge: 7 },
  { key:'staff',     label:'인력 관리' },
  { key:'archive',   label:'아카이브' },
];
const NAV_ICONS = {
  dashboard: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
  tasks:     <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/></svg>,
  reports:   <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>,
  staff:     <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
  archive:   <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/></svg>,
};

const ARCHIVE = [
  { id:1, name:'1층 로비 소화기 점검',     employee:'김보안', dept:'보안', priority:'high',   completedAt:'04/24 13:42', duration:'1.2시간', reviewer:'관리자1' },
  { id:2, name:'지하 1층 청소',             employee:'이청소', dept:'청소', priority:'medium', completedAt:'04/24 17:55', duration:'3.5시간', reviewer:'관리자1' },
  { id:3, name:'옥상 배수구 청소',          employee:'최청소', dept:'청소', priority:'medium', completedAt:'04/23 15:20', duration:'2.1시간', reviewer:'관리자2' },
  { id:4, name:'2층 화장실 수도꼭지 수리',  employee:'박유지', dept:'시설', priority:'high',   completedAt:'04/22 11:05', duration:'4.0시간', reviewer:'관리자1' },
];

// ── 사이드바 ──────────────────────────────────────────
function Sidebar({ active }) {
  return (
    <div style={{ width:220, flexShrink:0, background:C.sidebar, display:'flex', flexDirection:'column', height:'100vh', position:'sticky', top:0 }}>
      <div style={{ padding:'24px 20px 20px', borderBottom:'1px solid oklch(24% 0.02 250)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div style={{ width:32, height:32, borderRadius:8, background:C.primary, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
          <div>
            <div style={{ fontSize:14, fontWeight:700, color:'#fff' }}>영준피엠씨</div>
            <div style={{ fontSize:10, color:'oklch(50% 0.02 250)', marginTop:1 }}>관리자 포털</div>
          </div>
        </div>
      </div>
      <nav style={{ flex:1, padding:'12px 10px' }}>
        {NAV_ITEMS.map(item => {
          const isActive = item.key === active;
          return (
            <button key={item.key} style={{
              width:'100%', display:'flex', alignItems:'center', gap:10,
              padding:'10px 12px', borderRadius:8, border:'none', cursor:'pointer',
              background: isActive ? C.primary : 'transparent',
              color: isActive ? '#fff' : 'oklch(60% 0.02 250)',
              fontSize:13, fontWeight: isActive ? 600 : 400,
              fontFamily:"'Noto Sans KR', sans-serif",
              marginBottom:2, textAlign:'left', transition:'150ms ease',
            }}>
              {NAV_ICONS[item.key]}{item.label}
              {item.badge && <span style={{ marginLeft:'auto', fontSize:10, fontWeight:700, background: isActive ? 'rgba(255,255,255,0.25)' : C.danger, color:'#fff', borderRadius:10, padding:'1px 6px' }}>{item.badge}</span>}
            </button>
          );
        })}
      </nav>
      <div style={{ padding:'16px 16px 20px', borderTop:'1px solid oklch(24% 0.02 250)', display:'flex', alignItems:'center', gap:10 }}>
        <div style={{ width:32, height:32, borderRadius:'50%', background:'oklch(30% 0.03 250)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:700, color:'oklch(70% 0.02 250)', flexShrink:0 }}>박</div>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:13, fontWeight:600, color:'#fff' }}>박관리</div>
          <div style={{ fontSize:11, color:'oklch(45% 0.02 250)' }}>관리자</div>
        </div>
      </div>
    </div>
  );
}

function FilterSelect({ value, onChange, options, minWidth = 120 }) {
  return (
    <div style={{ position:'relative', display:'inline-flex' }}>
      <select value={value} onChange={e => onChange(e.target.value)} style={{
        padding:'8px 32px 8px 12px', borderRadius:8,
        border:`1.5px solid ${C.border}`, background:C.cardBg,
        color:C.textPri, fontSize:13, fontWeight:600, cursor:'pointer',
        fontFamily:"'Noto Sans KR', sans-serif", minWidth, outline:'none',
      }}>
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={C.textMuted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
        style={{ position:'absolute', right:10, top:'50%', transform:'translateY(-50%)', pointerEvents:'none' }}>
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </div>
  );
}

// ── 상세 보기 모달 ───────────────────────────────────
function DetailModal({ item, onClose }) {
  const dc = DEPT_COLOR[item.dept];
  const p = PRIORITY_MAP[item.priority];
  return (
    <div onClick={onClose} style={{
      position:'fixed', inset:0, background:'oklch(0% 0 0 / 45%)',
      display:'flex', alignItems:'center', justifyContent:'center',
      zIndex:100, animation:'fadeIn 0.2s ease', padding:20,
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        width:640, maxHeight:'90vh', overflowY:'auto',
        background:C.cardBg, borderRadius:14,
        boxShadow:'0 20px 60px oklch(0% 0 0 / 25%)',
        animation:'scaleIn 0.25s cubic-bezier(0.34,1.2,0.64,1)',
      }}>
        <div style={{ padding:'18px 22px', borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div>
            <div style={{ fontSize:11, fontWeight:700, color:C.textMuted, letterSpacing:'0.06em', marginBottom:2 }}>완료 보고 상세</div>
            <h2 style={{ fontSize:17, fontWeight:700, color:C.textPri }}>{item.name}</h2>
          </div>
          <button onClick={onClose} style={{ width:32, height:32, borderRadius:8, border:'none', background:'transparent', cursor:'pointer', color:C.textMuted, display:'flex', alignItems:'center', justifyContent:'center' }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div style={{ padding:'22px' }}>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginBottom:18 }}>
            <span style={{ fontSize:11, fontWeight:600, color:p.color, background:p.bg, borderRadius:6, padding:'3px 8px' }}>{p.label}</span>
            <span style={{ fontSize:11, fontWeight:600, color:dc, background:`${dc}18`, borderRadius:6, padding:'3px 8px' }}>{item.dept}</span>
            <span style={{ fontSize:11, fontWeight:600, color:C.success, background:C.successBg, borderRadius:6, padding:'3px 8px' }}>● 완료 확정</span>
          </div>

          {/* 사진 */}
          <div style={{ display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:8, marginBottom:18 }}>
            {[0,1].map(i => (
              <div key={i} style={{ aspectRatio:'4/3', borderRadius:10, background:`oklch(${72+i*3}% 0.09 ${195+i*40})`, display:'flex', alignItems:'center', justifyContent:'center' }}>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>
                </svg>
              </div>
            ))}
          </div>

          {/* 메모 */}
          <div style={{ marginBottom:18 }}>
            <div style={{ fontSize:12, fontWeight:700, color:C.textMuted, marginBottom:6, letterSpacing:'0.04em' }}>직원 메모</div>
            <div style={{ background:C.pageBg, border:`1px solid ${C.border}`, borderRadius:10, padding:'14px 16px', fontSize:13, color:C.textPri, lineHeight:1.7 }}>
              점검 완료. 압력 게이지 정상이며 외관 손상 없음. 다음 점검은 다음 달 24일 예정.
            </div>
          </div>

          {/* 처리 내역 */}
          <div>
            <div style={{ fontSize:12, fontWeight:700, color:C.textMuted, marginBottom:8, letterSpacing:'0.04em' }}>처리 내역</div>
            <div style={{ background:C.pageBg, border:`1px solid ${C.border}`, borderRadius:10, padding:'12px 16px' }}>
              {[
                { label:'담당 직원', val: item.employee },
                { label:'완료 시각', val: `2026/${item.completedAt}` },
                { label:'소요 시간', val: item.duration },
                { label:'검토자',    val: item.reviewer },
              ].map((r, i, arr) => (
                <div key={r.label} style={{ display:'flex', justifyContent:'space-between', padding:'8px 0', borderBottom: i < arr.length-1 ? `1px solid ${C.border}` : 'none' }}>
                  <span style={{ fontSize:12, color:C.textMuted }}>{r.label}</span>
                  <span style={{ fontSize:13, fontWeight:600, color:C.textPri }}>{r.val}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── 메인 ──────────────────────────────────────────────
function ArchivePage() {
  const [search, setSearch]         = useState('');
  const [period, setPeriod]         = useState('이번 달');
  const [dateFrom, setDateFrom]     = useState('2026-04-01');
  const [dateTo, setDateTo]         = useState('2026-04-30');
  const [deptFilter, setDeptFilter] = useState('전체');
  const [prioFilter, setPrioFilter] = useState('전체');
  const [detail, setDetail]         = useState(null);

  const showCustomRange = period === '직접 입력';

  return (
    <div style={{ flex:1, overflowY:'auto', padding:'28px 32px', minWidth:0 }}>
      {/* 헤더 */}
      <div style={{ marginBottom:24 }}>
        <h1 style={{ fontSize:22, fontWeight:700, color:C.textPri }}>업무 아카이브</h1>
        <div style={{ fontSize:13, color:C.textMuted, marginTop:3 }}>완료 확정된 업무 이력을 조회하세요</div>
      </div>

      {/* 필터 바 */}
      <div style={{ background:C.cardBg, borderRadius:12, border:`1px solid ${C.border}`, padding:'14px 16px', marginBottom:14, display:'flex', flexWrap:'wrap', gap:10, alignItems:'center' }}>
        <div style={{ position:'relative', flex:'1 1 220px', minWidth:220 }}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={C.textMuted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
            style={{ position:'absolute', left:11, top:'50%', transform:'translateY(-50%)', pointerEvents:'none' }}>
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input
            type="text" value={search} onChange={e => setSearch(e.target.value)}
            placeholder="업무명 또는 직원 이름 검색"
            style={{
              width:'100%', padding:'8px 12px 8px 34px', borderRadius:8,
              border:`1.5px solid ${C.border}`, fontSize:13, color:C.textPri,
              outline:'none', fontFamily:"'Noto Sans KR', sans-serif",
              background:C.pageBg,
            }}
          />
        </div>

        {/* 기간 세그먼트 */}
        <div style={{ display:'flex', gap:0, background:C.pageBg, border:`1px solid ${C.border}`, borderRadius:8, padding:3 }}>
          {['이번 주','이번 달','직접 입력'].map(p => (
            <button key={p} onClick={() => setPeriod(p)} style={{
              padding:'6px 14px', borderRadius:6, border:'none', cursor:'pointer',
              fontSize:12, fontWeight:600,
              background: period === p ? C.primary : 'transparent',
              color: period === p ? '#fff' : C.textSec,
              fontFamily:"'Noto Sans KR', sans-serif", transition:'150ms ease',
            }}>{p}</button>
          ))}
        </div>

        <FilterSelect value={deptFilter} onChange={setDeptFilter} options={['전체','보안','청소','시설유지보수']} minWidth={130} />
        <FilterSelect value={prioFilter} onChange={setPrioFilter} options={['전체','높음','보통','낮음']} minWidth={110} />

        <button style={{
          marginLeft:'auto', display:'flex', alignItems:'center', gap:6,
          padding:'8px 14px', borderRadius:8,
          border:`1.5px solid ${C.border}`, background:'#fff',
          fontSize:12, fontWeight:600, color:C.textSec, cursor:'pointer',
          fontFamily:"'Noto Sans KR', sans-serif",
        }}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          엑셀 내보내기
        </button>
      </div>

      {/* 직접 입력 시 날짜 범위 */}
      {showCustomRange && (
        <div style={{ background:C.cardBg, borderRadius:12, border:`1px solid ${C.border}`, padding:'12px 16px', marginBottom:14, display:'flex', alignItems:'center', gap:10 }}>
          <span style={{ fontSize:12, fontWeight:700, color:C.textMuted, letterSpacing:'0.04em' }}>기간</span>
          <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)} style={{ padding:'7px 10px', borderRadius:7, border:`1.5px solid ${C.border}`, background:C.pageBg, fontSize:13, color:C.textPri, outline:'none', fontFamily:"'Noto Sans KR', sans-serif" }} />
          <span style={{ fontSize:13, color:C.textMuted }}>~</span>
          <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)} style={{ padding:'7px 10px', borderRadius:7, border:`1.5px solid ${C.border}`, background:C.pageBg, fontSize:13, color:C.textPri, outline:'none', fontFamily:"'Noto Sans KR', sans-serif" }} />
        </div>
      )}

      {/* 통계 요약 바 */}
      <div style={{
        background:`linear-gradient(135deg, ${C.archive} 0%, ${C.cardBg} 100%)`,
        borderRadius:12, border:`1px solid ${C.border}`,
        padding:'18px 22px', marginBottom:18,
        display:'grid', gridTemplateColumns:'1fr 1fr 2fr',
        gap:24, alignItems:'center',
      }}>
        <div style={{ borderRight:`1px solid ${C.border}`, paddingRight:24 }}>
          <div style={{ fontSize:11, fontWeight:700, color:C.textMuted, letterSpacing:'0.06em', marginBottom:6 }}>완료 건수</div>
          <div style={{ display:'flex', alignItems:'baseline', gap:4 }}>
            <span style={{ fontSize:30, fontWeight:700, color:C.textPri, lineHeight:1 }}>37</span>
            <span style={{ fontSize:13, color:C.textMuted }}>건</span>
          </div>
        </div>
        <div style={{ borderRight:`1px solid ${C.border}`, paddingRight:24 }}>
          <div style={{ fontSize:11, fontWeight:700, color:C.textMuted, letterSpacing:'0.06em', marginBottom:6 }}>평균 소요 시간</div>
          <div style={{ display:'flex', alignItems:'baseline', gap:4 }}>
            <span style={{ fontSize:30, fontWeight:700, color:C.textPri, lineHeight:1 }}>2.3</span>
            <span style={{ fontSize:13, color:C.textMuted }}>시간</span>
          </div>
        </div>
        <div>
          <div style={{ fontSize:11, fontWeight:700, color:C.textMuted, letterSpacing:'0.06em', marginBottom:8 }}>직군별 완료 건수</div>
          <div style={{ display:'flex', gap:18 }}>
            {[
              { dept:'보안', count:12 },
              { dept:'청소', count:15 },
              { dept:'시설', count:10 },
            ].map(d => {
              const dc = DEPT_COLOR[d.dept];
              const total = 37;
              const pct = (d.count / total * 100).toFixed(0);
              return (
                <div key={d.dept} style={{ flex:1 }}>
                  <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:5 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                      <span style={{ width:6, height:6, borderRadius:'50%', background:dc, display:'inline-block' }} />
                      <span style={{ fontSize:12, fontWeight:600, color:C.textPri }}>{d.dept}</span>
                    </div>
                    <div style={{ display:'flex', alignItems:'baseline', gap:3 }}>
                      <span style={{ fontSize:15, fontWeight:700, color:C.textPri }}>{d.count}</span>
                      <span style={{ fontSize:11, color:C.textMuted }}>건</span>
                    </div>
                  </div>
                  <div style={{ height:5, background:C.pageBg, borderRadius:3, overflow:'hidden' }}>
                    <div style={{ width:`${pct}%`, height:'100%', background:dc, borderRadius:3 }} />
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* 테이블 */}
      <div style={{ background:C.cardBg, borderRadius:12, border:`1px solid ${C.border}`, overflow:'hidden' }}>
        <div style={{ padding:'14px 18px', borderBottom:`1px solid ${C.border}`, background:C.pageBg, display:'flex', alignItems:'center', gap:8 }}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.textSec} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/>
          </svg>
          <span style={{ fontSize:13, fontWeight:700, color:C.textPri }}>완료 업무 이력</span>
          <span style={{ fontSize:12, color:C.textMuted, marginLeft:'auto' }}>총 37건 중 4건 표시</span>
        </div>
        <table style={{ width:'100%', borderCollapse:'collapse' }}>
          <thead>
            <tr style={{ background:C.archive, borderBottom:`1px solid ${C.border}` }}>
              {['업무명','직원','직군','우선순위','완료 시각','소요 시간','검토자','상세'].map(h => (
                <th key={h} style={{ padding:'10px 16px', fontSize:11, fontWeight:700, color:C.textMuted, textAlign:'left', letterSpacing:'0.04em', whiteSpace:'nowrap' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {ARCHIVE.map(item => {
              const p = PRIORITY_MAP[item.priority];
              const dc = DEPT_COLOR[item.dept];
              return (
                <tr key={item.id} style={{ borderTop:`1px solid ${C.border}`, transition:'120ms' }}
                  onMouseEnter={e => e.currentTarget.style.background = C.pageBg}
                  onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                  <td style={{ padding:'12px 16px', fontSize:13, fontWeight:600, color:C.textPri }}>{item.name}</td>
                  <td style={{ padding:'12px 16px', fontSize:13, color:C.textSec }}>{item.employee}</td>
                  <td style={{ padding:'12px 16px' }}>
                    <span style={{ display:'inline-flex', alignItems:'center', gap:5, fontSize:11, fontWeight:600, color:dc, background:`${dc}18`, borderRadius:6, padding:'3px 8px' }}>
                      <span style={{ width:5, height:5, borderRadius:'50%', background:dc }} />
                      {item.dept}
                    </span>
                  </td>
                  <td style={{ padding:'12px 16px' }}>
                    <span style={{ fontSize:11, fontWeight:600, color:p.color, background:p.bg, borderRadius:6, padding:'3px 8px' }}>{p.label}</span>
                  </td>
                  <td style={{ padding:'12px 16px', fontSize:13, color:C.textSec, fontVariantNumeric:'tabular-nums' }}>{item.completedAt}</td>
                  <td style={{ padding:'12px 16px', fontSize:13, color:C.textSec, fontWeight:600, fontVariantNumeric:'tabular-nums' }}>{item.duration}</td>
                  <td style={{ padding:'12px 16px', fontSize:13, color:C.textSec }}>
                    <span style={{ display:'inline-flex', alignItems:'center', gap:5 }}>
                      <span style={{ width:18, height:18, borderRadius:'50%', background:C.primaryBg, color:C.primary, fontSize:9, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>관</span>
                      {item.reviewer}
                    </span>
                  </td>
                  <td style={{ padding:'12px 16px' }}>
                    <button onClick={() => setDetail(item)} style={{
                      padding:'6px 12px', borderRadius:7,
                      border:`1px solid ${C.border}`, background:'#fff',
                      cursor:'pointer', fontSize:12, fontWeight:600, color:C.textSec,
                      fontFamily:"'Noto Sans KR', sans-serif", transition:'150ms ease',
                      display:'inline-flex', alignItems:'center', gap:4,
                    }}
                    onMouseEnter={e => { e.currentTarget.style.background = C.primaryBg; e.currentTarget.style.borderColor = C.primary; e.currentTarget.style.color = C.primary; }}
                    onMouseLeave={e => { e.currentTarget.style.background = '#fff'; e.currentTarget.style.borderColor = C.border; e.currentTarget.style.color = C.textSec; }}>
                      상세보기
                      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* 페이지네이션 */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginTop:14 }}>
        <span style={{ fontSize:13, color:C.textMuted }}>총 37건 · 페이지 1 / 4</span>
        <div style={{ display:'flex', gap:4 }}>
          {[1,2,3,4].map(n => (
            <button key={n} style={{
              width:32, height:32, borderRadius:7,
              border:`1px solid ${n===1 ? C.primary : C.border}`,
              background: n===1 ? C.primary : C.cardBg,
              color: n===1 ? '#fff' : C.textSec,
              fontSize:13, fontWeight: n===1 ? 700 : 400,
              cursor:'pointer', fontFamily:"'Noto Sans KR', sans-serif",
            }}>{n}</button>
          ))}
        </div>
      </div>

      {detail && <DetailModal item={detail} onClose={() => setDetail(null)} />}
    </div>
  );
}

function App() {
  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
      <Sidebar active="archive" />
      <ArchivePage />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

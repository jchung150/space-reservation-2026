<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCR-E03 캘린더 뷰 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app-header.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: oklch(92% 0.008 240);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

const C = {
  primary:  'oklch(55% 0.14 195)',
  danger:   'oklch(62% 0.16 25)',
  success:  'oklch(62% 0.15 160)',
  warning:  'oklch(75% 0.16 85)',
  border:   'oklch(88% 0.008 240)',
  cardBg:   'oklch(95% 0.005 220)',
  textPri:  'oklch(18% 0.01 260)',
  textSec:  'oklch(50% 0.01 260)',
};

const DAYS = ['일','월','화','수','목','금','토'];

// ── 샘플 업무 데이터 (날짜 → 배열) ──────────────────
const TASK_DATA = {
  '2026-04-24': [
    { id:1, name:'1층 로비 소화기 점검', priority:'high' },
    { id:2, name:'지하 1층 청소',        priority:'medium' },
  ],
  '2026-04-28': [
    { id:3, name:'월간 소방 훈련', priority:'high', repeat: true },
  ],
  '2026-04-30': [
    { id:4, name:'3층 복도 전구 교체', priority:'low' },
  ],
  '2026-04-15': [
    { id:5, name:'주차장 CCTV 확인', priority:'medium' },
  ],
  '2026-04-10': [
    { id:6, name:'옥상 배수구 점검', priority:'high' },
  ],
  '2026-04-17': [
    { id:7, name:'엘리베이터 정기 점검', priority:'medium' },
    { id:8, name:'로비 청소', priority:'low' },
  ],
};

const PRIORITY_MAP = {
  high:   { label:'높음', color: C.danger,  dot:'#ef4444' },
  medium: { label:'보통', color: C.warning, dot:'#f97316' },
  low:    { label:'낮음', color: C.success, dot:'#22c55e' },
};

function fmt(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

// ── 아이콘 ────────────────────────────────────────────
function IconChevronLeft() {
  return <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>;
}
function IconChevronRight() {
  return <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>;
}
function IconRepeat() {
  return <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>;
}
function IconLogout() {
  return <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
}
function IconList() {
  return <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>;
}
function IconCalendar() {
  return <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
}

// ── 월간 뷰 ──────────────────────────────────────────
function MonthView({ year, month, selectedDate, onSelectDate }) {
  const today = new Date(2026, 3, 24); // 2026-04-24 고정

  const firstDay = new Date(year, month, 1).getDay(); // 0=일
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  // 6줄 맞추기
  while (cells.length % 7 !== 0) cells.push(null);

  const isToday = (d) => d && year === today.getFullYear() && month === today.getMonth() && d === today.getDate();
  const isSelected = (d) => d && fmt(year, month, d) === selectedDate;

  return (
    <div>
      {/* 요일 헤더 */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', marginBottom:4 }}>
        {DAYS.map((day, i) => (
          <div key={day} style={{
            textAlign:'center', fontSize:12, fontWeight:600, padding:'4px 0',
            color: i===0 ? C.danger : i===6 ? C.primary : C.textSec,
          }}>{day}</div>
        ))}
      </div>
      {/* 날짜 셀 */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:'2px 0' }}>
        {cells.map((d, i) => {
          const dateKey = d ? fmt(year, month, d) : null;
          const tasks = dateKey ? (TASK_DATA[dateKey] || []) : [];
          const hasRepeat = tasks.some(t => t.repeat);
          const priorities = [...new Set(tasks.map(t => t.priority))];
          const isTod = isToday(d);
          const isSel = isSelected(d);
          const isSun = i % 7 === 0;
          const isSat = i % 7 === 6;

          return (
            <div
              key={i}
              onClick={() => d && onSelectDate(dateKey)}
              style={{
                display:'flex', flexDirection:'column', alignItems:'center',
                padding:'4px 2px 6px', cursor: d ? 'pointer' : 'default',
                borderRadius: 10,
                background: isSel && !isTod ? 'oklch(93% 0.06 195)' : 'transparent',
                transition:'150ms ease',
              }}
            >
              {d ? (
                <>
                  <div style={{
                    width:30, height:30, borderRadius:'50%',
                    display:'flex', alignItems:'center', justifyContent:'center',
                    background: isTod ? C.primary : 'transparent',
                    color: isTod ? '#fff' : isSun ? C.danger : isSat ? C.primary : C.textPri,
                    fontSize:14, fontWeight: isTod || isSel ? 700 : 400,
                  }}>{d}</div>
                  {/* 우선순위 도트 */}
                  <div style={{ display:'flex', gap:2, marginTop:3, alignItems:'center', minHeight:8 }}>
                    {priorities.map(p => (
                      <span key={p} style={{
                        width:5, height:5, borderRadius:'50%',
                        background: PRIORITY_MAP[p].dot,
                        display:'inline-block',
                      }} />
                    ))}
                    {hasRepeat && (
                      <span style={{ color: C.primary, marginLeft:1, display:'flex' }}>
                        <IconRepeat />
                      </span>
                    )}
                  </div>
                </>
              ) : null}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── 주간 뷰 ──────────────────────────────────────────
function WeekView({ year, month, selectedDate, onSelectDate }) {
  const today = new Date(2026, 3, 24);
  // 선택된 날짜 기준 주간
  const selD = selectedDate ? new Date(selectedDate) : today;
  const dayOfWeek = selD.getDay();
  const weekStart = new Date(selD);
  weekStart.setDate(selD.getDate() - dayOfWeek);

  const days = Array.from({length:7}, (_, i) => {
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    return d;
  });

  return (
    <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:'2px 0' }}>
      {DAYS.map((day, i) => (
        <div key={day} style={{
          textAlign:'center', fontSize:12, fontWeight:600, padding:'4px 0 2px',
          color: i===0 ? C.danger : i===6 ? C.primary : C.textSec,
        }}>{day}</div>
      ))}
      {days.map((d, i) => {
        const dateKey = fmt(d.getFullYear(), d.getMonth(), d.getDate());
        const tasks = TASK_DATA[dateKey] || [];
        const priorities = [...new Set(tasks.map(t => t.priority))];
        const hasRepeat = tasks.some(t => t.repeat);
        const isTod = d.getFullYear()===today.getFullYear() && d.getMonth()===today.getMonth() && d.getDate()===today.getDate();
        const isSel = dateKey === selectedDate;
        const isSun = i===0, isSat = i===6;

        return (
          <div key={i} onClick={() => onSelectDate(dateKey)}
            style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'4px 2px 6px', cursor:'pointer',
              borderRadius:10, background: isSel && !isTod ? 'oklch(93% 0.06 195)' : 'transparent', transition:'150ms ease' }}>
            <div style={{ width:30, height:30, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center',
              background: isTod ? C.primary : 'transparent',
              color: isTod ? '#fff' : isSun ? C.danger : isSat ? C.primary : C.textPri,
              fontSize:14, fontWeight: isTod || isSel ? 700 : 400 }}>
              {d.getDate()}
            </div>
            <div style={{ display:'flex', gap:2, marginTop:3, alignItems:'center', minHeight:8 }}>
              {priorities.map(p => (
                <span key={p} style={{ width:5, height:5, borderRadius:'50%', background: PRIORITY_MAP[p].dot, display:'inline-block' }} />
              ))}
              {hasRepeat && <span style={{ color: C.primary, marginLeft:1, display:'flex' }}><IconRepeat /></span>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── 미니 카드 ─────────────────────────────────────────
function MiniCard({ task }) {
  const p = PRIORITY_MAP[task.priority];
  return (
    <div style={{
      display:'flex', alignItems:'center', gap:10,
      background:'#fff', borderRadius:10, padding:'10px 12px',
      border:`1px solid ${C.border}`,
      boxShadow:'0 1px 3px oklch(0% 0 0 / 5%)',
    }}>
      <span style={{ width:6, height:6, borderRadius:'50%', background:p.dot, flexShrink:0 }} />
      <div style={{ flex:1 }}>
        <div style={{ fontSize:14, fontWeight:600, color:C.textPri }}>{task.name}</div>
        {task.repeat && (
          <div style={{ fontSize:11, color:C.primary, display:'flex', alignItems:'center', gap:3, marginTop:2 }}>
            <IconRepeat /> 반복 일정
          </div>
        )}
      </div>
      <span style={{
        fontSize:11, fontWeight:600, color:p.color,
        background:`${p.color}18`, borderRadius:6, padding:'2px 8px', flexShrink:0,
      }}>{p.label}</span>
    </div>
  );
}

// ── 메인 앱 ──────────────────────────────────────────
function App() {
  const [activeTab, setActiveTab]       = useState('calendar');
  const [calMode, setCalMode]           = useState('month'); // 'month' | 'week'
  const [viewYear, setViewYear]         = useState(2026);
  const [viewMonth, setViewMonth]       = useState(3); // 0-indexed: 3=April
  const [selectedDate, setSelectedDate] = useState('2026-04-24');

  const monthLabel = `${viewYear}년 ${viewMonth + 1}월`;

  function prevPeriod() {
    if (calMode === 'month') {
      if (viewMonth === 0) { setViewYear(y => y-1); setViewMonth(11); }
      else setViewMonth(m => m-1);
    } else {
      const d = new Date(selectedDate);
      d.setDate(d.getDate() - 7);
      setSelectedDate(fmt(d.getFullYear(), d.getMonth(), d.getDate()));
      setViewYear(d.getFullYear()); setViewMonth(d.getMonth());
    }
  }
  function nextPeriod() {
    if (calMode === 'month') {
      if (viewMonth === 11) { setViewYear(y => y+1); setViewMonth(0); }
      else setViewMonth(m => m+1);
    } else {
      const d = new Date(selectedDate);
      d.setDate(d.getDate() + 7);
      setSelectedDate(fmt(d.getFullYear(), d.getMonth(), d.getDate()));
      setViewYear(d.getFullYear()); setViewMonth(d.getMonth());
    }
  }

  const selectedTasks = selectedDate ? (TASK_DATA[selectedDate] || []) : [];

  // 선택된 날짜 포맷
  const selDateLabel = useMemo(() => {
    if (!selectedDate) return '';
    const [y, m, d] = selectedDate.split('-').map(Number);
    const dayName = DAYS[new Date(y, m-1, d).getDay()];
    return `${m}월 ${d}일 (${dayName})`;
  }, [selectedDate]);

  return (
    <div style={{
      width:'100%', height:'100%',
      display:'flex', flexDirection:'column',
      background:'#fff',
      fontFamily:"'Noto Sans KR', sans-serif",
      overflow:'hidden',
    }}>
      {/* ── 헤더 ── */}
      <AppHeader activeTab={activeTab} onTabChange={setActiveTab} />

      {/* ── 캘린더 영역 ── */}
      <div style={{ flex:1, overflowY:'auto', display:'flex', flexDirection:'column' }}>

        {/* 캘린더 컨트롤 */}
        <div style={{ padding:'10px 16px 0', background:'#fff', borderBottom:`1px solid ${C.border}` }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
            {/* 이전 */}
            <button onClick={prevPeriod} style={{ background:'none', border:'none', cursor:'pointer', color:C.textPri, padding:6, borderRadius:8, display:'flex', alignItems:'center' }}>
              <IconChevronLeft />
            </button>
            {/* 연월 */}
            <span style={{ fontSize:16, fontWeight:700, color:C.textPri }}>{monthLabel}</span>
            {/* 다음 */}
            <button onClick={nextPeriod} style={{ background:'none', border:'none', cursor:'pointer', color:C.textPri, padding:6, borderRadius:8, display:'flex', alignItems:'center' }}>
              <IconChevronRight />
            </button>
          </div>
          {/* 주간/월간 토글 */}
          <div style={{ display:'flex', background:C.cardBg, borderRadius:8, padding:3, marginBottom:12, width:'fit-content', margin:'0 auto 12px' }}>
            {['month','week'].map(mode => (
              <button key={mode} onClick={() => setCalMode(mode)} style={{
                padding:'5px 18px', borderRadius:6, border:'none', cursor:'pointer',
                fontSize:13, fontWeight:600,
                background: calMode===mode ? '#fff' : 'transparent',
                color: calMode===mode ? C.primary : C.textSec,
                boxShadow: calMode===mode ? '0 1px 3px oklch(0% 0 0 / 10%)' : 'none',
                transition:'150ms ease',
              }}>
                {mode==='month' ? '월간' : '주간'}
              </button>
            ))}
          </div>

          {/* 달력 */}
          <div style={{ padding:'0 0 12px' }}>
            {calMode === 'month'
              ? <MonthView year={viewYear} month={viewMonth} selectedDate={selectedDate} onSelectDate={setSelectedDate} />
              : <WeekView  year={viewYear} month={viewMonth} selectedDate={selectedDate} onSelectDate={setSelectedDate} />
            }
          </div>
        </div>

        {/* ── 선택 날짜 업무 목록 ── */}
        <div style={{ flex:1, padding:'14px 16px 24px', background:C.cardBg }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
            <span style={{ fontSize:14, fontWeight:700, color:C.textPri }}>{selDateLabel} 업무</span>
            <span style={{ fontSize:12, color:C.textSec }}>{selectedTasks.length}건</span>
          </div>

          {selectedTasks.length === 0 ? (
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'32px 0', color:C.textSec, gap:8 }}>
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                <rect x="9" y="3" width="6" height="4" rx="2"/>
              </svg>
              <span style={{ fontSize:13 }}>이 날에는 배정된 업무가 없습니다</span>
            </div>
          ) : (
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {selectedTasks.map(task => <MiniCard key={task.id} task={task} />)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Root() {
  return (
    <IOSDevice width={390} height={844} time="09:41">
      <App />
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>

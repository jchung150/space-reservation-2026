<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCR-E05 완료 보고 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app-header.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: oklch(92% 0.008 240);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;

const C = {
  primary:  'oklch(55% 0.14 195)',
  danger:   'oklch(62% 0.16 25)',
  success:  'oklch(62% 0.15 160)',
  warning:  'oklch(75% 0.16 85)',
  border:   'oklch(88% 0.008 240)',
  cardBg:   'oklch(95% 0.005 220)',
  textPri:  'oklch(18% 0.01 260)',
  textSec:  'oklch(50% 0.01 260)',
};

// 데모용 더미 사진 색상
const PHOTO_COLORS = [
  'oklch(78% 0.08 200)', 'oklch(75% 0.09 145)',
  'oklch(80% 0.07 50)',  'oklch(76% 0.08 280)',
  'oklch(79% 0.07 25)',
];

const TASK = { name: '1층 로비 소화기 점검', priority: 'high' };
const PRIORITY_MAP = {
  high:   { label: '높음', color: C.danger,  dot: '#ef4444' },
  medium: { label: '보통', color: C.warning, dot: '#f97316' },
  low:    { label: '낮음', color: C.success, dot: '#22c55e' },
};

function SectionTitle({ children }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 10 }}>
      <span style={{ fontSize: 13, fontWeight: 700, color: C.textPri }}>{children}</span>
    </div>
  );
}

function App() {
  const [photos, setPhotos]         = useState([]); // 0~5 more photos (데모: 색상으로 표현)
  const [memo, setMemo]             = useState('');
  const [showPhotoSheet, setShowPhotoSheet] = useState(false);
  const [keyboardUp, setKeyboardUp] = useState(false);
  const textareaRef = useRef(null);

  const p = PRIORITY_MAP[TASK.priority];
  const isValid = photos.length > 0 && memo.length >= 10;
  const MAX_PHOTOS = 5;
  const MAX_MEMO = 500;

  function addDemoPhoto() {
    if (photos.length >= MAX_PHOTOS) return;
    setPhotos(prev => [...prev, PHOTO_COLORS[prev.length]]);
    setShowPhotoSheet(false);
  }

  function removePhoto(i) {
    setPhotos(prev => prev.filter((_, idx) => idx !== i));
  }

  return (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', flexDirection: 'column',
      background: C.cardBg,
      fontFamily: "'Noto Sans KR', sans-serif",
      overflow: 'hidden',
      position: 'relative',
    }}>

      {/* ── 헤더 ── */}
      <AppHeader variant="detail" title="완료 보고" />

      {/* ── 업무 요약 바 ── */}
      <div style={{
        padding: '10px 16px',
        background: '#fff',
        borderBottom: `1px solid ${C.border}`,
        display: 'flex', alignItems: 'center', gap: 8,
      }}>
        <span style={{
          display: 'inline-flex', alignItems: 'center', gap: 4,
          fontSize: 11, fontWeight: 600, color: p.color,
          background: `${p.color}18`, borderRadius: 6, padding: '2px 8px', flexShrink: 0,
        }}>
          <span style={{ width: 5, height: 5, borderRadius: '50%', background: p.dot }} />
          {p.label}
        </span>
        <span style={{
          fontSize: 14, fontWeight: 600, color: C.textPri,
          overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
        }}>{TASK.name}</span>
      </div>

      {/* ── 스크롤 영역 ── */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '16px 16px 0' }}>

        {/* ── 사진 첨부 섹션 ── */}
        <div style={{
          background: '#fff', borderRadius: 12,
          border: `1px solid ${C.border}`,
          padding: '16px', marginBottom: 12,
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
            <SectionTitle required>완료 사진 첨부</SectionTitle>
            <span style={{ fontSize: 12, color: photos.length === MAX_PHOTOS ? C.danger : C.textSec, fontWeight: 600 }}>
              {photos.length} / {MAX_PHOTOS}
            </span>
          </div>

          {/* 사진 그리드 */}
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
            {photos.map((color, i) => (
              <div key={i} style={{ position: 'relative', width: 76, height: 76 }}>
                <div style={{
                  width: 76, height: 76, borderRadius: 8,
                  background: color,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  <span style={{ fontSize: 10, color: 'white', fontFamily: 'monospace' }}>사진 {i+1}</span>
                </div>
                <button
                  onClick={() => removePhoto(i)}
                  style={{
                    position: 'absolute', top: -6, right: -6,
                    width: 20, height: 20, borderRadius: '50%',
                    background: C.danger, border: '2px solid #fff',
                    color: '#fff', fontSize: 11, fontWeight: 700,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    cursor: 'pointer', lineHeight: 1,
                  }}
                >×</button>
              </div>
            ))}

            {/* 추가 버튼 */}
            {photos.length < MAX_PHOTOS && (
              <button
                onClick={() => setShowPhotoSheet(true)}
                style={{
                  width: photos.length === 0 ? '100%' : 76,
                  height: photos.length === 0 ? 100 : 76,
                  borderRadius: 8,
                  border: `2px dashed ${C.border}`,
                  background: C.cardBg,
                  cursor: 'pointer',
                  display: 'flex', flexDirection: 'column',
                  alignItems: 'center', justifyContent: 'center', gap: 6,
                  color: C.textSec, transition: '150ms ease',
                }}
              >
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                  <circle cx="12" cy="13" r="4"/>
                </svg>
                {photos.length === 0 && (
                  <span style={{ fontSize: 13, fontWeight: 600 }}>+ 사진 추가</span>
                )}
              </button>
            )}
          </div>
        </div>

        {/* ── 메모 섹션 ── */}
        <div style={{
          background: '#fff', borderRadius: 12,
          border: `1px solid ${C.border}`,
          padding: '16px', marginBottom: 12,
        }}>
          <SectionTitle required>완료 메모</SectionTitle>
          <textarea
            ref={textareaRef}
            value={memo}
            onChange={e => setMemo(e.target.value.slice(0, MAX_MEMO))}
            onFocus={() => setKeyboardUp(true)}
            onBlur={() => setKeyboardUp(false)}
            placeholder="업무 완료 내용을 입력해주세요. 최소 10자 이상"
            style={{
              width: '100%', height: 130,
              border: `1.5px solid ${C.border}`,
              borderRadius: 8, padding: '12px',
              fontSize: 14, color: C.textPri,
              fontFamily: "'Noto Sans KR', sans-serif",
              lineHeight: 1.65, resize: 'none',
              outline: 'none', background: C.cardBg,
              transition: '150ms ease',
            }}
            onFocusCapture={e => { e.target.style.borderColor = C.primary; e.target.style.background = '#fff'; }}
            onBlurCapture={e => { e.target.style.borderColor = C.border; e.target.style.background = C.cardBg; }}
          />
          <div style={{
            display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 6,
          }}>
            <span style={{ fontSize: 12, color: memo.length > 0 && memo.length < 10 ? C.danger : C.textSec }}>
              {memo.length > 0 && memo.length < 10 ? `최소 10자 필요 (${10 - memo.length}자 더)` : ''}
            </span>
            <span style={{ fontSize: 12, color: memo.length >= MAX_MEMO ? C.danger : C.textSec }}>
              {memo.length} / {MAX_MEMO}
            </span>
          </div>
        </div>

        <div style={{ height: 88 }} />
      </div>

      {/* ── 하단 고정 버튼 ── */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0,
        padding: '12px 16px 28px',
        background: '#fff',
        borderTop: `1px solid ${C.border}`,
      }}>
        <button
          disabled={!isValid}
          style={{
            width: '100%', padding: '15px',
            borderRadius: 10, border: 'none',
            fontSize: 16, fontWeight: 700,
            cursor: isValid ? 'pointer' : 'not-allowed',
            background: isValid ? C.primary : C.border,
            color: isValid ? '#fff' : C.textSec,
            transition: '150ms ease',
          }}
        >
          {!photos.length ? '사진을 먼저 첨부해주세요'
            : memo.length < 10 ? `메모 ${Math.max(0, 10 - memo.length)}자 더 입력해주세요`
            : '다음 (미리보기)'}
        </button>
      </div>

      {/* ── 사진 선택 바텀 시트 ── */}
      {showPhotoSheet && (
        <div
          onClick={() => setShowPhotoSheet(false)}
          style={{
            position: 'absolute', inset: 0,
            background: 'oklch(0% 0 0 / 40%)',
            display: 'flex', alignItems: 'flex-end',
            zIndex: 100,
          }}
        >
          <div
            onClick={e => e.stopPropagation()}
            style={{
              width: '100%', background: '#fff',
              borderRadius: '20px 20px 0 0',
              padding: '16px 16px 36px',
            }}
          >
            <div style={{ width: 36, height: 4, borderRadius: 2, background: C.border, margin: '0 auto 16px' }} />
            <div style={{ fontSize: 15, fontWeight: 700, color: C.textPri, marginBottom: 14, textAlign: 'center' }}>
              사진 추가
            </div>
            {[
              { icon: '📷', label: '카메라로 촬영', sub: '지금 바로 촬영합니다' },
              { icon: '🖼', label: '갤러리에서 선택', sub: '저장된 사진을 선택합니다' },
            ].map(item => (
              <button
                key={item.label}
                onClick={addDemoPhoto}
                style={{
                  width: '100%', padding: '14px 16px',
                  background: C.cardBg, border: `1px solid ${C.border}`,
                  borderRadius: 10, cursor: 'pointer',
                  display: 'flex', alignItems: 'center', gap: 14,
                  marginBottom: 8, textAlign: 'left',
                  fontFamily: "'Noto Sans KR', sans-serif",
                }}
              >
                <span style={{ fontSize: 22 }}>{item.icon}</span>
                <div>
                  <div style={{ fontSize: 15, fontWeight: 600, color: C.textPri }}>{item.label}</div>
                  <div style={{ fontSize: 12, color: C.textSec, marginTop: 2 }}>{item.sub}</div>
                </div>
              </button>
            ))}
            <button
              onClick={() => setShowPhotoSheet(false)}
              style={{
                width: '100%', padding: '13px',
                border: 'none', background: 'none',
                fontSize: 15, fontWeight: 600, color: C.textSec,
                cursor: 'pointer', marginTop: 4,
                fontFamily: "'Noto Sans KR', sans-serif",
              }}
            >취소</button>
          </div>
        </div>
      )}
    </div>
  );
}

function Root() {
  return (
    <IOSDevice width={390} height={844} time="09:41">
      <App />
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>

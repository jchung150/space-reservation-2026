<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCR-A05 완료 보고 검토 목록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { font-family: 'Noto Sans KR', sans-serif; background: oklch(95% 0.005 220); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: oklch(80% 0.01 240); border-radius: 3px; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes newBadgeFade {
    0%   { opacity: 1; transform: scale(1); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: scale(0.8); }
  }
  .slide-down { animation: slideDown 0.35s cubic-bezier(0.34,1.2,0.64,1) both; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const C = {
  primary:   'oklch(55% 0.14 195)',
  primaryBg: 'oklch(93% 0.06 195)',
  danger:    'oklch(62% 0.16 25)',
  dangerBg:  'oklch(95% 0.04 25)',
  success:   'oklch(62% 0.15 160)',
  successBg: 'oklch(93% 0.05 160)',
  warning:   'oklch(65% 0.16 65)',
  warningBg: 'oklch(95% 0.05 85)',
  border:    'oklch(88% 0.008 240)',
  cardBg:    '#ffffff',
  pageBg:    'oklch(95% 0.005 220)',
  sidebar:   'oklch(16% 0.02 250)',
  textPri:   'oklch(18% 0.01 260)',
  textSec:   'oklch(50% 0.01 260)',
  textMuted: 'oklch(65% 0.01 260)',
};

const DEPT_COLOR = {
  보안: 'oklch(65% 0.16 65)',
  청소: 'oklch(62% 0.15 160)',
  시설: 'oklch(55% 0.14 195)',
};
const PRIORITY_MAP = {
  high:   { label:'높음', color: C.danger,  bg: C.dangerBg },
  medium: { label:'보통', color: C.warning, bg: C.warningBg },
  low:    { label:'낮음', color: C.success, bg: C.successBg },
};
const PHOTO_COLORS = [
  'oklch(72% 0.09 195)', 'oklch(75% 0.09 145)',
  'oklch(78% 0.08 50)',  'oklch(72% 0.09 280)',
];

const NAV_ITEMS = [
  { key:'dashboard', label:'대시보드' },
  { key:'tasks',     label:'업무 관리' },
  { key:'reports',   label:'완료 보고 검토', badge: 7 },
  { key:'staff',     label:'인력 관리' },
  { key:'archive',   label:'아카이브' },
];
const NAV_ICONS = {
  dashboard: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
  tasks:     <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/></svg>,
  reports:   <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>,
  staff:     <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
  archive:   <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/></svg>,
};

const INITIAL_REPORTS = [
  { id:1, employee:'김보안', dept:'보안', task:'1층 로비 소화기 점검',    priority:'high',   timeAgo:'방금 전',  photoColor: PHOTO_COLORS[0], status:'pending', isNew: true },
  { id:2, employee:'이청소', dept:'청소', task:'지하 1층 청소',            priority:'medium', timeAgo:'12분 전', photoColor: PHOTO_COLORS[1], status:'pending', isNew: false },
  { id:3, employee:'박유지', dept:'시설', task:'2층 화장실 수도꼭지 수리', priority:'high',   timeAgo:'34분 전', photoColor: PHOTO_COLORS[2], status:'pending', isNew: false },
  { id:4, employee:'최청소', dept:'청소', task:'옥상 배수구 청소',         priority:'medium', timeAgo:'1시간 전', photoColor: PHOTO_COLORS[3], status:'pending', isNew: false },
  { id:5, employee:'이보안', dept:'보안', task:'주차장 CCTV 확인',         priority:'low',    timeAgo:'2시간 전', photoColor: PHOTO_COLORS[0], status:'approved', isNew: false },
  { id:6, employee:'정유지', dept:'시설', task:'엘리베이터 점검',          priority:'high',   timeAgo:'3시간 전', photoColor: PHOTO_COLORS[1], status:'rejected', isNew: false },
];

// ── 사이드바 ──────────────────────────────────────────
function Sidebar({ active }) {
  return (
    <div style={{ width:220, flexShrink:0, background:C.sidebar, display:'flex', flexDirection:'column', height:'100vh', position:'sticky', top:0 }}>
      <div style={{ padding:'24px 20px 20px', borderBottom:'1px solid oklch(24% 0.02 250)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div style={{ width:32, height:32, borderRadius:8, background:C.primary, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
          <div>
            <div style={{ fontSize:14, fontWeight:700, color:'#fff' }}>영준피엠씨</div>
            <div style={{ fontSize:10, color:'oklch(50% 0.02 250)', marginTop:1 }}>관리자 포털</div>
          </div>
        </div>
      </div>
      <nav style={{ flex:1, padding:'12px 10px' }}>
        {NAV_ITEMS.map(item => {
          const isActive = item.key === active;
          return (
            <button key={item.key} style={{
              width:'100%', display:'flex', alignItems:'center', gap:10,
              padding:'10px 12px', borderRadius:8, border:'none', cursor:'pointer',
              background: isActive ? C.primary : 'transparent',
              color: isActive ? '#fff' : 'oklch(60% 0.02 250)',
              fontSize:13, fontWeight: isActive ? 600 : 400,
              fontFamily:"'Noto Sans KR', sans-serif",
              marginBottom:2, textAlign:'left', transition:'150ms ease',
            }}>
              {NAV_ICONS[item.key]}{item.label}
              {item.badge && <span style={{ marginLeft:'auto', fontSize:10, fontWeight:700, background: isActive ? 'rgba(255,255,255,0.25)' : C.danger, color:'#fff', borderRadius:10, padding:'1px 6px' }}>{item.badge}</span>}
            </button>
          );
        })}
      </nav>
      <div style={{ padding:'16px 16px 20px', borderTop:'1px solid oklch(24% 0.02 250)', display:'flex', alignItems:'center', gap:10 }}>
        <div style={{ width:32, height:32, borderRadius:'50%', background:'oklch(30% 0.03 250)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:700, color:'oklch(70% 0.02 250)', flexShrink:0 }}>박</div>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:13, fontWeight:600, color:'#fff' }}>박관리</div>
          <div style={{ fontSize:11, color:'oklch(45% 0.02 250)' }}>관리자</div>
        </div>
        <button style={{ background:'none', border:'none', cursor:'pointer', color:'oklch(40% 0.02 250)', padding:4, display:'flex' }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  );
}

// ── 보고 카드 ─────────────────────────────────────────
function ReportCard({ report, isNew, onReview }) {
  const p = PRIORITY_MAP[report.priority];
  const dc = DEPT_COLOR[report.dept];

  return (
    <div className={isNew ? 'slide-down' : ''} style={{
      background: C.cardBg,
      borderRadius: 12,
      border: `1px solid ${isNew ? 'oklch(75% 0.1 195)' : C.border}`,
      boxShadow: isNew
        ? `0 0 0 2px oklch(85% 0.08 195), 0 4px 16px oklch(55% 0.14 195 / 12%)`
        : '0 1px 4px oklch(0% 0 0 / 5%)',
      padding: '16px 20px',
      display: 'flex', alignItems: 'center', gap: 16,
      transition: '200ms ease',
      position: 'relative',
    }}>
      {/* NEW 배지 */}
      {isNew && (
        <div style={{
          position:'absolute', top:-9, left:16,
          background: C.primary, color:'#fff',
          fontSize:10, fontWeight:700, borderRadius:10,
          padding:'2px 8px', letterSpacing:'0.06em',
        }}>NEW</div>
      )}

      {/* 사진 썸네일 */}
      <div style={{
        width:64, height:64, borderRadius:10,
        background: report.photoColor, flexShrink:0,
        display:'flex', alignItems:'center', justifyContent:'center',
        overflow:'hidden',
      }}>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </div>

      {/* 메인 정보 */}
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6, flexWrap:'wrap' }}>
          {/* 직원명 */}
          <span style={{ fontSize:14, fontWeight:700, color:C.textPri }}>{report.employee}</span>
          {/* 직군 배지 */}
          <span style={{
            fontSize:11, fontWeight:600, color:dc, background:`${dc}18`,
            borderRadius:6, padding:'2px 8px',
          }}>{report.dept}</span>
          {/* 우선순위 */}
          <span style={{ fontSize:11, fontWeight:600, color:p.color, background:p.bg, borderRadius:6, padding:'2px 8px' }}>{p.label}</span>
        </div>
        {/* 업무명 */}
        <div style={{ fontSize:14, fontWeight:600, color:C.textPri, marginBottom:5, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
          {report.task}
        </div>
        {/* 제출 시각 */}
        <div style={{ display:'flex', alignItems:'center', gap:4, fontSize:12, color:C.textMuted }}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          {report.timeAgo} 제출
        </div>
      </div>

      {/* 검토하기 버튼 */}
      <button onClick={() => onReview(report)} style={{
        padding:'9px 20px', borderRadius:8, flexShrink:0,
        border:`1.5px solid ${C.primary}`, background:'transparent',
        color:C.primary, fontSize:13, fontWeight:700, cursor:'pointer',
        fontFamily:"'Noto Sans KR', sans-serif", transition:'150ms ease',
        whiteSpace:'nowrap',
      }}
      onMouseEnter={e => { e.currentTarget.style.background = C.primaryBg; }}
      onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; }}>
        검토하기 →
      </button>
    </div>
  );
}

// ── 빈 상태 ───────────────────────────────────────────
function EmptyState({ label }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'60px 0', gap:12, color:C.textMuted }}>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="9" y1="13" x2="15" y2="13"/>
      </svg>
      <span style={{ fontSize:14 }}>{label}이 없습니다</span>
    </div>
  );
}

// ── 메인 콘텐츠 ──────────────────────────────────────
function ReportList() {
  const [tab, setTab]       = useState('pending');
  const [reports, setReports] = useState(INITIAL_REPORTS);
  const [liveCount, setLiveCount] = useState(4);
  const counterRef = useRef(100);

  // 데모: 8초마다 새 보고 자동 추가
  useEffect(() => {
    const t = setInterval(() => {
      const demoNames = [
        { employee:'이보안', dept:'보안', task:'야간 순찰 보고',    priority:'medium', photoColor: PHOTO_COLORS[0] },
        { employee:'정유지', dept:'시설', task:'3층 소화전 점검',   priority:'high',   photoColor: PHOTO_COLORS[2] },
      ];
      const pick = demoNames[counterRef.current % demoNames.length];
      counterRef.current++;
      const newReport = { ...pick, id: Date.now(), timeAgo:'방금 전', status:'pending', isNew:true };
      setReports(prev => [newReport, ...prev.map(r => ({ ...r, isNew:false }))]);
      setLiveCount(c => c + 1);
    }, 8000);
    return () => clearInterval(t);
  }, []);

  const TAB_DEFS = [
    { key:'pending',  label:'검토 대기', count: reports.filter(r => r.status==='pending').length },
    { key:'approved', label:'승인 완료', count: reports.filter(r => r.status==='approved').length },
    { key:'rejected', label:'반려됨',    count: reports.filter(r => r.status==='rejected').length },
    { key:'all',      label:'전체',      count: reports.length },
  ];

  const filtered = tab === 'all' ? reports : reports.filter(r => {
    if (tab==='pending')  return r.status==='pending';
    if (tab==='approved') return r.status==='approved';
    if (tab==='rejected') return r.status==='rejected';
    return true;
  });

  return (
    <div style={{ flex:1, overflowY:'auto', padding:'28px 32px', minWidth:0 }}>
      {/* 헤더 */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:24 }}>
        <div>
          <h1 style={{ fontSize:22, fontWeight:700, color:C.textPri }}>완료 보고 검토</h1>
          <div style={{ fontSize:13, color:C.textMuted, marginTop:3 }}>직원이 제출한 완료 보고를 검토하고 승인 또는 반려하세요</div>
        </div>
        {/* LIVE 배지 */}
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div style={{
            display:'flex', alignItems:'center', gap:6,
            background:'oklch(20% 0.04 160 / 8%)',
            border:'1px solid oklch(62% 0.15 160 / 30%)',
            borderRadius:8, padding:'7px 14px',
          }}>
            <span style={{ width:8, height:8, borderRadius:'50%', background:C.success, display:'inline-block', animation:'pulse 1.5s ease infinite' }} />
            <span style={{ fontSize:12, fontWeight:700, color:C.success, letterSpacing:'0.05em' }}>LIVE</span>
            <span style={{ fontSize:12, color:C.textSec }}>실시간 자동 갱신 중</span>
          </div>
        </div>
      </div>

      {/* 탭 */}
      <div style={{ display:'flex', gap:0, borderBottom:`1px solid ${C.border}`, marginBottom:20 }}>
        {TAB_DEFS.map(t => (
          <button key={t.key} onClick={() => setTab(t.key)} style={{
            padding:'10px 20px', border:'none', background:'none', cursor:'pointer',
            fontSize:14, fontWeight: tab===t.key ? 700 : 400,
            color: tab===t.key ? C.primary : C.textSec,
            borderBottom: tab===t.key ? `2px solid ${C.primary}` : '2px solid transparent',
            fontFamily:"'Noto Sans KR', sans-serif", transition:'150ms ease',
            display:'flex', alignItems:'center', gap:6,
            marginBottom:-1,
          }}>
            {t.label}
            <span style={{
              fontSize:11, fontWeight:700, borderRadius:10, padding:'1px 7px',
              background: tab===t.key
                ? (t.key==='pending' ? C.danger : C.primary)
                : C.border,
              color: tab===t.key ? '#fff' : C.textSec,
              transition:'150ms ease',
            }}>{t.count}</span>
          </button>
        ))}
      </div>

      {/* 카드 목록 */}
      <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
        {filtered.length === 0
          ? <EmptyState label={TAB_DEFS.find(t=>t.key===tab)?.label} />
          : filtered.map(report => (
            <ReportCard key={report.id} report={report} isNew={report.isNew} onReview={() => {}} />
          ))
        }
      </div>
    </div>
  );
}

function App() {
  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
      <Sidebar active="reports" />
      <ReportList />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCR-E04 업무 상세 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app-header.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: oklch(92% 0.008 240);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const C = {
  primary:  'oklch(55% 0.14 195)',
  danger:   'oklch(62% 0.16 25)',
  success:  'oklch(62% 0.15 160)',
  warning:  'oklch(75% 0.16 85)',
  border:   'oklch(88% 0.008 240)',
  cardBg:   'oklch(95% 0.005 220)',
  textPri:  'oklch(18% 0.01 260)',
  textSec:  'oklch(50% 0.01 260)',
};

const PRIORITY_MAP = {
  high:   { label: '높음', color: C.danger,  dot: '#ef4444' },
  medium: { label: '보통', color: C.warning, dot: '#f97316' },
  low:    { label: '낮음', color: C.success, dot: '#22c55e' },
};

const STATUS_MAP = {
  todo:       { label: '작업전',  bg: 'oklch(92% 0.008 240)', color: C.textSec },
  inprogress: { label: '작업 중', bg: 'oklch(93% 0.06 195)',  color: C.primary },
  done:       { label: '완료',    bg: 'oklch(92% 0.06 160)',  color: C.success },
};

// 샘플 업무 (토글로 상태 변경 가능)
const SAMPLE_TASKS = [
  {
    id: 1,
    priority: 'high',
    status: 'todo',
    name: '1층 로비 소화기 점검',
    due: '2026년 4월 25일 14:00',
    assignedBy: '박관리',
    assignedAt: '2026년 4월 24일',
    description: '1층 로비 소화기 3개의 압력 게이지를 확인하고 이상 유무를 보고하세요. 압력이 정상 범위(녹색 구간)를 벗어난 경우 즉시 관리자에게 연락하십시오.\n\n점검 항목:\n• 압력 게이지 정상 범위 확인\n• 안전핀 이탈 여부 확인\n• 소화기 외관 손상 여부 확인\n• 점검 라벨 부착 여부 확인',
    hasAttachment: true,
  },
  {
    id: 2,
    priority: 'medium',
    status: 'inprogress',
    name: '지하 1층 청소',
    due: '2026년 4월 25일 18:00',
    assignedBy: '박관리',
    assignedAt: '2026년 4월 24일',
    description: '지하 1층 주차장 및 복도 전체 청소를 진행해 주세요. 청소 후 반드시 사진 촬영하여 보고서에 첨부하십시오.',
    hasAttachment: false,
  },
  {
    id: 3,
    priority: 'medium',
    status: 'done',
    name: '주차장 CCTV 확인',
    due: '2026년 4월 24일 09:00',
    assignedBy: '이어드민',
    assignedAt: '2026년 4월 23일',
    description: '지하 주차장 CCTV 4개 카메라의 영상 출력 및 녹화 상태를 확인하세요. 이상이 있는 경우 카메라 번호와 증상을 기록하여 보고하십시오.',
    hasAttachment: false,
  },
];

// ── 이미지 플레이스홀더 ────────────────────────────
function ImgPlaceholder() {
  return (
    <div style={{
      width: 96, height: 72, borderRadius: 8,
      background: C.cardBg,
      border: `1px solid ${C.border}`,
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      gap: 4, flexShrink: 0,
    }}>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={C.textSec} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span style={{ fontSize: 9, color: C.textSec, fontFamily: 'monospace' }}>참고 이미지</span>
    </div>
  );
}

// ── 정보 행 ───────────────────────────────────────
function InfoRow({ icon, label, value }) {
  return (
    <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10, padding: '8px 0' }}>
      <span style={{ color: C.textSec, flexShrink: 0, marginTop: 1 }}>{icon}</span>
      <span style={{ fontSize: 13, color: C.textSec, flexShrink: 0, width: 52 }}>{label}</span>
      <span style={{ fontSize: 14, color: C.textPri, fontWeight: 600, flex: 1 }}>{value}</span>
    </div>
  );
}

// ── 섹션 제목 ─────────────────────────────────────
function SectionTitle({ children }) {
  return (
    <div style={{
      fontSize: 12, fontWeight: 700, color: C.textSec,
      letterSpacing: '0.04em', textTransform: 'uppercase',
      marginBottom: 10,
    }}>{children}</div>
  );
}

// ── 메인 앱 ──────────────────────────────────────
function App() {
  const [taskIdx, setTaskIdx] = useState(0);
  const task = SAMPLE_TASKS[taskIdx];
  const p = PRIORITY_MAP[task.priority];
  const s = STATUS_MAP[task.status];
  const isDone = task.status === 'done';

  return (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', flexDirection: 'column',
      background: C.cardBg,
      fontFamily: "'Noto Sans KR', sans-serif",
      overflow: 'hidden',
    }}>

      {/* ── 헤더 ── */}
      <AppHeader variant="detail" title="업무 상세" />


      {/* ── 스크롤 영역 ── */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '16px 16px 0' }}>

        {/* ── 업무 정보 카드 ── */}
        <div style={{
          background: '#fff', borderRadius: 12,
          border: `1px solid ${C.border}`,
          boxShadow: '0 1px 4px oklch(0% 0 0 / 6%)',
          padding: '16px',
          marginBottom: 12,
        }}>
          {/* 배지 행 */}
          <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
            <span style={{
              display: 'inline-flex', alignItems: 'center', gap: 5,
              fontSize: 12, fontWeight: 600, color: p.color,
              background: `${p.color}18`, borderRadius: 6, padding: '3px 10px',
            }}>
              <span style={{ width: 6, height: 6, borderRadius: '50%', background: p.dot }} />
              {p.label}
            </span>
            <span style={{
              fontSize: 12, fontWeight: 600, color: s.color,
              background: s.bg, borderRadius: 6, padding: '3px 10px',
            }}>{s.label}</span>
          </div>

          {/* 업무명 */}
          <div style={{ fontSize: 20, fontWeight: 700, color: C.textPri, lineHeight: 1.4, marginBottom: 16 }}>
            {task.name}
          </div>

          {/* 구분선 */}
          <div style={{ height: 1, background: C.border, margin: '0 0 12px' }} />

          {/* 정보 목록 */}
          <InfoRow
            icon={<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>}
            label="마감일시"
            value={task.due}
          />
          <div style={{ height: 1, background: C.border }} />
          <InfoRow
            icon={<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>}
            label="배정자"
            value={task.assignedBy}
          />
          <div style={{ height: 1, background: C.border }} />
          <InfoRow
            icon={<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>}
            label="배정일"
            value={task.assignedAt}
          />
        </div>

        {/* ── 업무 지시사항 카드 ── */}
        <div style={{
          background: '#fff', borderRadius: 12,
          border: `1px solid ${C.border}`,
          boxShadow: '0 1px 4px oklch(0% 0 0 / 6%)',
          padding: '16px',
          marginBottom: 12,
        }}>
          <SectionTitle>업무 지시사항</SectionTitle>
          <p style={{
            fontSize: 14, color: C.textPri, lineHeight: 1.75,
            whiteSpace: 'pre-line',
          }}>{task.description}</p>
        </div>

        {/* ── 참고 자료 카드 ── */}
        {task.hasAttachment && (
          <div style={{
            background: '#fff', borderRadius: 12,
            border: `1px solid ${C.border}`,
            boxShadow: '0 1px 4px oklch(0% 0 0 / 6%)',
            padding: '16px',
            marginBottom: 12,
          }}>
            <SectionTitle>참고 자료</SectionTitle>
            <div style={{ display: 'flex', gap: 10 }}>
              <ImgPlaceholder />
              <div style={{ display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 4 }}>
                <span style={{ fontSize: 13, fontWeight: 600, color: C.textPri }}>소화기_점검표.jpg</span>
                <span style={{ fontSize: 12, color: C.textSec }}>관리자 첨부 · 245 KB</span>
              </div>
            </div>
          </div>
        )}

        {/* 하단 여백 (버튼 높이만큼) */}
        <div style={{ height: 88 }} />
      </div>

      {/* ── 하단 고정 버튼 ── */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0,
        padding: '12px 16px 28px',
        background: '#fff',
        borderTop: `1px solid ${C.border}`,
      }}>
        <button
          disabled={isDone}
          style={{
            width: '100%', padding: '15px',
            borderRadius: 10, border: 'none',
            fontSize: 16, fontWeight: 700,
            cursor: isDone ? 'not-allowed' : 'pointer',
            background: isDone ? C.border : C.primary,
            color: isDone ? C.textSec : '#fff',
            transition: '150ms ease',
            letterSpacing: '0.01em',
          }}
        >
          {isDone ? '이미 완료된 업무입니다' : '완료 보고하기'}
        </button>
      </div>

      {/* ── 샘플 전환 (데모용) ── */}
      <div style={{
        position: 'absolute', top: 100, right: -110,
        display: 'flex', flexDirection: 'column', gap: 6,
      }}>
        {SAMPLE_TASKS.map((t, i) => (
          <button key={t.id} onClick={() => setTaskIdx(i)} style={{
            fontSize: 11, padding: '5px 10px', borderRadius: 6,
            border: `1.5px solid ${taskIdx === i ? C.primary : C.border}`,
            background: taskIdx === i ? `oklch(93% 0.06 195)` : '#fff',
            color: taskIdx === i ? C.primary : C.textSec,
            cursor: 'pointer', whiteSpace: 'nowrap', fontWeight: 600,
            fontFamily: "'Noto Sans KR', sans-serif",
          }}>
            {STATUS_MAP[t.status].label}
          </button>
        ))}
        <span style={{ fontSize: 10, color: C.textSec, textAlign: 'center' }}>상태 전환</span>
      </div>
    </div>
  );
}

function Root() {
  return (
    <IOSDevice width={390} height={844} time="09:41">
      <App />
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>

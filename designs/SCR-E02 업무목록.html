<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCR-E02 업무 목록 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app-header.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: oklch(92% 0.008 240);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

// ── 색상 토큰 ──────────────────────────────────────────
const C = {
  primary:   'oklch(55% 0.14 195)',
  danger:    'oklch(62% 0.16 25)',
  dangerBg:  'oklch(96% 0.04 25)',
  success:   'oklch(62% 0.15 160)',
  warning:   'oklch(75% 0.16 85)',
  cardBg:    'oklch(95% 0.005 220)',
  border:    'oklch(88% 0.008 240)',
  textPri:   'oklch(18% 0.01 260)',
  textSec:   'oklch(50% 0.01 260)',
};

// ── 샘플 데이터 ──────────────────────────────────────
const TASKS = [
  { id: 1, priority: 'high',   name: '1층 로비 소화기 점검', due: '오늘 14:00', status: 'todo' },
  { id: 2, priority: 'medium', name: '지하 1층 청소',         due: '오늘 18:00', status: 'inprogress' },
  { id: 3, priority: 'low',    name: '3층 복도 전구 교체',    due: '내일 10:00', status: 'todo' },
  { id: 4, priority: 'high',   name: '옥상 배수구 점검',      due: '오늘 16:00', status: 'inprogress' },
  { id: 5, priority: 'medium', name: '주차장 CCTV 확인',      due: '내일 09:00', status: 'done' },
];

const PRIORITY_MAP = {
  high:   { label: '높음', color: C.danger,  dot: '#ef4444' },
  medium: { label: '보통', color: C.warning, dot: '#f97316' },
  low:    { label: '낮음', color: C.success, dot: '#22c55e' },
};

const STATUS_MAP = {
  todo:       { label: '작업전',  bg: 'oklch(92% 0.008 240)', color: C.textSec },
  inprogress: { label: '작업 중', bg: 'oklch(93% 0.06 195)',  color: C.primary },
  done:       { label: '완료',    bg: 'oklch(92% 0.06 160)',  color: C.success },
};

const PRIORITY_FILTERS = ['전체', '높음', '보통', '낮음'];
const STATUS_FILTERS   = ['전체', '작업전', '작업 중', '완료'];

// ── 아이콘 SVG ──────────────────────────────────────
function IconLogout() {
  return (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
  );
}
function IconChevron() {
  return (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  );
}
function IconCalendar() {
  return (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
  );
}
function IconList() {
  return (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
      <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
    </svg>
  );
}

// ── 업무 카드 ─────────────────────────────────────────
function TaskCard({ task, onTap }) {
  const p = PRIORITY_MAP[task.priority];
  const s = STATUS_MAP[task.status];
  const isRework = task.status === 'rework';
  const isHigh   = task.priority === 'high';

  const [pressed, setPressed] = useState(false);

  return (
    <div
      onClick={() => onTap(task)}
      onMouseDown={() => setPressed(true)}
      onMouseUp={() => setPressed(false)}
      onMouseLeave={() => setPressed(false)}
      style={{
        display: 'flex',
        alignItems: 'stretch',
        background: '#fff',
        borderRadius: 12,
        border: `1px solid ${C.border}`,
        boxShadow: '0 1px 4px oklch(0% 0 0 / 6%)',
        overflow: 'hidden',
        cursor: 'pointer',
        transform: pressed ? 'scale(0.985)' : 'scale(1)',
        transition: '150ms ease',
        userSelect: 'none',
      }}
    >
      {/* 좌측 강조 바 제거됨 */}
      <div style={{ flex: 1, padding: '14px 14px 14px', display: 'flex', flexDirection: 'column', gap: 8 }}>
        {/* 상단: 우선순위 배지 + 상태 나란히 */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <span style={{
            display: 'inline-flex', alignItems: 'center', gap: 5,
            fontSize: 12, fontWeight: 600, color: p.color,
            background: `${p.color}18`, borderRadius: 6,
            padding: '2px 8px',
          }}>
            <span style={{ width: 6, height: 6, borderRadius: '50%', background: p.dot, display: 'inline-block' }} />
            {p.label}
          </span>
          <span style={{
            fontSize: 12, fontWeight: 600, color: s.color,
            background: s.bg, borderRadius: 6, padding: '2px 8px',
          }}>
            {s.label}
          </span>
        </div>
        {/* 업무명 */}
        <div style={{ fontSize: 16, fontWeight: 700, color: C.textPri, lineHeight: 1.4 }}>
          {task.name}
        </div>
        {/* 마감일시 */}
        <div style={{ fontSize: 13, color: C.textSec, display: 'flex', alignItems: 'center', gap: 4 }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          마감 {task.due}
        </div>
      </div>
      {/* 우측 화살표 */}
      <div style={{ display: 'flex', alignItems: 'center', paddingRight: 12, color: C.textSec }}>
        <IconChevron />
      </div>
    </div>
  );
}

// ── 메인 앱 ──────────────────────────────────────────
function App() {
  const [activeTab, setActiveTab] = useState('list');
  const [priorityFilter, setPriorityFilter] = useState('전체');
  const [statusFilter, setStatusFilter]   = useState('전체');
  const [selectedTask, setSelectedTask]   = useState(null);

  const filteredTasks = TASKS.filter(t => {
    const p = PRIORITY_MAP[t.priority];
    const s = STATUS_MAP[t.status];
    const matchP = priorityFilter === '전체' || p.label === priorityFilter;
    const matchS = !statusFilter || statusFilter === '전체' || s.label === statusFilter;
    return matchP && matchS;
  });

  return (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', flexDirection: 'column',
      background: '#fff',
      fontFamily: "'Noto Sans KR', sans-serif",
      overflow: 'hidden',
    }}>
      {/* ── 헤더 ── */}
      <AppHeader activeTab={activeTab} onTabChange={setActiveTab} />

      {activeTab === 'list' ? (
        <>
          {/* ── 필터 바 ── */}
          <div style={{
            padding: '10px 16px',
            background: '#fff',
            borderBottom: `1px solid ${C.border}`,
            display: 'flex', flexDirection: 'column', gap: 8,
          }}>
            {/* 우선순위 필터 */}
            <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
              <span style={{ fontSize: 11, color: C.textSec, flexShrink: 0 }}>우선순위</span>
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                {PRIORITY_FILTERS.map(f => (
                  <button
                    key={f}
                    onClick={() => setPriorityFilter(f)}
                    style={{
                      padding: '4px 12px', borderRadius: 20,
                      fontSize: 12, fontWeight: 600, cursor: 'pointer',
                      border: `1.5px solid ${priorityFilter === f ? C.primary : C.border}`,
                      background: priorityFilter === f ? `oklch(93% 0.06 195)` : '#fff',
                      color: priorityFilter === f ? C.primary : C.textSec,
                      transition: '150ms ease',
                    }}
                  >{f}</button>
                ))}
              </div>
            </div>
            {/* 상태 필터 */}
            <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
              <span style={{ fontSize: 11, color: C.textSec, flexShrink: 0 }}>상태</span>
              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                {STATUS_FILTERS.map(f => (
                  <button
                    key={f}
                    onClick={() => setStatusFilter(f === '전체' ? '전체' : statusFilter === f ? '전체' : f)}
                    style={{
                      padding: '4px 12px', borderRadius: 20,
                      fontSize: 12, fontWeight: 600, cursor: 'pointer',
                      border: `1.5px solid ${statusFilter === f ? C.primary : C.border}`,
                      background: statusFilter === f ? `oklch(93% 0.06 195)` : '#fff',
                      color: statusFilter === f ? C.primary : C.textSec,
                      transition: '150ms ease',
                    }}
                  >{f}</button>
                ))}
              </div>
            </div>
          </div>

          {/* ── 업무 카드 목록 ── */}
          <div style={{
            flex: 1, overflowY: 'auto',
            padding: '12px 16px',
            paddingBottom: 24,
            display: 'flex', flexDirection: 'column', gap: 10,
          }}>
            {/* 날짜 + 카운트 */}
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 2 }}>
              <span style={{ fontSize: 13, fontWeight: 600, color: C.textSec }}>2025년 4월 24일 (목)</span>
              <span style={{ fontSize: 12, color: C.textSec }}>총 {filteredTasks.length}건</span>
            </div>

            {filteredTasks.length === 0 ? (
              <div style={{
                flex: 1, display: 'flex', flexDirection: 'column',
                alignItems: 'center', justifyContent: 'center',
                padding: '60px 0', color: C.textSec, gap: 10,
              }}>
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                  <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                  <rect x="9" y="3" width="6" height="4" rx="2"/>
                </svg>
                <span style={{ fontSize: 14 }}>해당하는 업무가 없습니다</span>
              </div>
            ) : (
              filteredTasks.map(task => (
                <TaskCard key={task.id} task={task} onTap={setSelectedTask} />
              ))
            )}
          </div>
        </>
      ) : (
        /* ── 캘린더 뷰 플레이스홀더 ── */
        <div style={{
          flex: 1, display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center',
          color: C.textSec, gap: 12, padding: 32,
        }}>
          <IconCalendar />
          <span style={{ fontSize: 15, fontWeight: 600 }}>캘린더 뷰</span>
          <span style={{ fontSize: 13, textAlign: 'center', lineHeight: 1.6 }}>SCR-E03 캘린더 화면이<br/>여기에 표시됩니다</span>
        </div>
      )}

      {/* ── 업무 상세 모달 (탭 시) ── */}
      {selectedTask && (
        <div
          onClick={() => setSelectedTask(null)}
          style={{
            position: 'absolute', inset: 0,
            background: 'oklch(0% 0 0 / 40%)',
            display: 'flex', alignItems: 'flex-end',
            zIndex: 100,
          }}
        >
          <div
            onClick={e => e.stopPropagation()}
            style={{
              width: '100%', background: '#fff',
              borderRadius: '20px 20px 0 0',
              padding: '20px 20px 36px',
              display: 'flex', flexDirection: 'column', gap: 14,
            }}
          >
            {/* 핸들 */}
            <div style={{ width: 36, height: 4, borderRadius: 2, background: C.border, margin: '0 auto 4px' }} />
            {/* 배지 행 */}
            <div style={{ display: 'flex', gap: 8 }}>
              <span style={{
                fontSize: 12, fontWeight: 600,
                color: PRIORITY_MAP[selectedTask.priority].color,
                background: `${PRIORITY_MAP[selectedTask.priority].color}18`,
                borderRadius: 6, padding: '3px 10px',
              }}>
                {PRIORITY_MAP[selectedTask.priority].label}
              </span>
              <span style={{
                fontSize: 12, fontWeight: 600,
                color: STATUS_MAP[selectedTask.status].color,
                background: STATUS_MAP[selectedTask.status].bg,
                borderRadius: 6, padding: '3px 10px',
              }}>
                {STATUS_MAP[selectedTask.status].label}
              </span>
            </div>
            <div style={{ fontSize: 18, fontWeight: 700, color: C.textPri }}>{selectedTask.name}</div>
            <div style={{ fontSize: 14, color: C.textSec }}>마감: {selectedTask.due}</div>
            <div style={{ display: 'flex', gap: 10, marginTop: 4 }}>
              <button
                onClick={() => setSelectedTask(null)}
                style={{
                  flex: 1, padding: '14px', borderRadius: 8,
                  border: `1.5px solid ${C.border}`, background: '#fff',
                  fontSize: 15, fontWeight: 600, color: C.textSec, cursor: 'pointer',
                }}
              >닫기</button>
              <button
                style={{
                  flex: 2, padding: '14px', borderRadius: 8,
                  border: 'none', background: C.primary,
                  fontSize: 15, fontWeight: 700, color: '#fff', cursor: 'pointer',
                }}
              >업무 상세 보기 →</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── iOS 프레임으로 감싸기 ──────────────────────────────
function Root() {
  return (
    <IOSDevice width={390} height={844} time="09:41">
      <App />
    </IOSDevice>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
